<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>White styles A–D · compare</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#0e0e0e; color:#f0ece0; font-family:'Space Mono', monospace; }
  header { padding:18px 24px 6px; display:flex; flex-wrap:wrap; align-items:baseline; gap:10px 22px; }
  h1 { font-family:'Bebas Neue', sans-serif; font-size:40px; margin:0; letter-spacing:.02em; }
  h1 span { background:#c8f135; color:#0e0e0e; padding:0 .08em; }
  nav { display:flex; gap:6px; flex-wrap:wrap; }
  nav a { color:#0e0e0e; background:#f0ece0; text-decoration:none; font-weight:700; font-size:12px; padding:4px 9px; letter-spacing:.06em; }
  nav a.on { background:#c8f135; }
  .grid { display:flex; gap:22px; padding:12px 24px 28px; overflow-x:auto; }
  figure { margin:0; flex:none; }
  figcaption { font-size:12px; font-weight:700; letter-spacing:.08em; margin:0 0 8px; text-transform:uppercase; }
  figcaption b { background:#c8f135; color:#0e0e0e; padding:0 6px; margin-right:6px; }
  figcaption small { display:block; font-weight:400; text-transform:none; letter-spacing:0; margin-top:3px; max-width:393px; }
  figcaption a { color:#c8f135; }
  .frame { width:393px; height:660px; overflow:hidden; border-radius:6px; transform-origin:0 0; }
  iframe { width:393px; height:660px; border:0; background:#f0ece0; display:block; }
</style>
</head>
<body>
<header>
  <h1>White styles <span>A–D</span></h1>
  <nav id="nav"></nav>
</header>
<div class="grid" id="grid"></div>
<script>
  var Q = new URLSearchParams(location.search);
  var STEP = Q.get('step') || 'whatyouwant';
  var V = Q.get('v') || '';
  var PATH = Q.get('path') || '';
  var S = [
    ['A', 'Lab form', 'Clinical research form: 2px black boxes, Q3.x tags, mono data, graph-paper grid.'],
    ['B', 'Neo-brutalist', 'Thick black borders, hard offset shadows, lime and orange blocks, Bebas labels.'],
    ['C', 'Editorial', 'Black cards on cream, cream text inside, lime accents, big condensed headline.'],
    ['D', 'Questionnaire', 'Survey sheet: ruled lines, numbered questions, black section bar, orange ideal.'],
    ['A2', 'Lab form + orange', 'A with orange blocks for IDEAL, answered values and EDIT; lime stays for selection and NEXT.'],
    ['AB', 'Lab x Brutalist', 'A structure + 2px boxes with 3px hard shadows, Bebas labels, orange IDEAL, dark-green-edged NEXT (&btn=black to compare).']
  ];
  var VIEWS = [['whatyouwant', 'step=whatyouwant'], ['whoyouare', 'step=whoyouare'], ['whoyouare_filled', 'step=whoyouare&demo=filled'], ['page0', 'p0=2w']];
  var q0 = (VIEWS.find(function (x) { return x[0] === STEP; }) || VIEWS[0])[1];
  var nav = document.getElementById('nav');
  VIEWS.forEach(function (x) {
    var a = document.createElement('a'); a.textContent = x[0].toUpperCase();
    var p = new URLSearchParams(Q); p.set('step', x[0]); a.href = '?' + p.toString(); if (x[0] === STEP) a.className = 'on'; nav.appendChild(a);
  });
  ['single', 'couple'].forEach(function (x) {
    var a = document.createElement('a'); a.textContent = x.toUpperCase();
    var p = new URLSearchParams(Q); if (x === 'couple') p.set('path', 'couple'); else p.delete('path'); a.href = '?' + p.toString();
    if ((x === 'couple') === /^coup/i.test(PATH)) a.className = 'on'; nav.appendChild(a);
  });
  var g = document.getElementById('grid');
  S.forEach(function (s) {
    var src = 'white-styles_grokbot.html?' + q0 + '&wstyle=' + s[0] + (PATH ? '&path=' + encodeURIComponent(PATH) : '') + (V ? '&v=' + encodeURIComponent(V) : '');
    var f = document.createElement('figure');
    f.innerHTML = '<figcaption><b>' + s[0] + '</b>' + s[1] + ' · <a href="' + src + '" target="_blank">open</a><small>' + s[2] + '</small></figcaption><div class="frame"><iframe loading="eager" src="' + src + '"></iframe></div>';
    g.appendChild(f);
  });
  // keep each 393x660 phone (and its sheets' DONE button) fully on screen: scale the frames to the visible height
  function fit() { var k = Math.min(1, (window.innerHeight - 140) / 660);
    document.querySelectorAll('figure').forEach(function (fg) { var fr = fg.querySelector('.frame'); fr.style.transform = k < 1 ? 'scale(' + k + ')' : ''; fr.style.marginBottom = k < 1 ? (660 * (k - 1)) + 'px' : ''; fr.style.marginRight = k < 1 ? (393 * (k - 1)) + 'px' : ''; }); }
  window.addEventListener('resize', fit); fit();
</script>
</body>
</html>
