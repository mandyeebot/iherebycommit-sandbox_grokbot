<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Who You Are · fully collapsed · styles</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* Static mock of Sandbox 2 (s3y223) Who You Are, every question answered = 20 collapsed cards. &style=black|blackfix|A|A2|B|AB|all */
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body { font-family:'Space Mono', monospace; -webkit-text-size-adjust:100%; }
  .ph { height:100vh; height:100dvh; max-height:100%; display:flex; flex-direction:column; padding:12px 24px calc(env(safe-area-inset-bottom, 0px) + 4px); overflow:hidden; }
  .prog { display:flex; gap:5px; flex:none; }
  .prog i { flex:1; height:3px; }
  .lab { flex:none; margin-top:11px; font-size:10px; letter-spacing:.15em; text-transform:uppercase; line-height:15px; white-space:nowrap; }
  .lab b { font-weight:700; padding:1px 5px; letter-spacing:.12em; }
  .lab u { text-underline-offset:3px; }
  h1 { flex:none; margin:6px 0 0; font:400 52px/0.95 'Bebas Neue', sans-serif; letter-spacing:.02em; }
  h1 em { font-style:normal; padding:0 .06em; }
  .sub { flex:none; margin:6px 0 10px; font-size:10.75px; line-height:16px; white-space:nowrap; }
  .grid { flex:1; min-height:0; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:repeat(10, minmax(0, 1fr)); column-gap:10px; row-gap:4px; counter-reset:q; }
  .c { min-width:0; min-height:0; display:grid; grid-template-columns:minmax(0,1fr) auto; grid-template-rows:auto auto; align-content:center; column-gap:4px; padding:0 9px; counter-increment:q; overflow:hidden; }
  .k { grid-column:1 / 3; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-transform:uppercase; }
  .v { min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .e { align-self:center; text-transform:uppercase; white-space:nowrap; cursor:pointer; background:none; border:0; padding:0; font-family:inherit; }
  .bot { flex:none; padding-top:8px; display:flex; flex-direction:column; align-items:stretch; }
  .next { border:0; font:400 22px/1 'Bebas Neue', sans-serif; letter-spacing:.1em; padding:15px 0 13px; }
  .back { background:none; border:0; font:12px 'Space Mono', monospace; letter-spacing:.08em; padding:8px 0 6px; }

  /* ---- black: current s3y223 ---- */
  .s-black body, body.s-black { background:#0e0e0e; color:#f0ece0; }
  body.s-black .prog i { background:#2a2a2a; } body.s-black .prog i.on { background:#f0ece0; }
  body.s-black .lab { color:#888; } body.s-black .lab b { background:#c8f135; color:#0e0e0e; } body.s-black .lab u { color:#888; }
  body.s-black h1 em { color:#c8f135; padding:0; }
  body.s-black .sub { color:#888; }
  body.s-black .c { border:1px solid #333; border-radius:4px; }
  body.s-black .k { font-size:10px; letter-spacing:.15em; color:#888; line-height:14px; }
  body.s-black .v { font-size:13px; line-height:18px; color:#f0ece0; }
  body.s-black .e { font-size:10px; letter-spacing:.15em; color:#888; text-decoration:underline; text-underline-offset:3px; }
  body.s-black .next { background:#c8f135; color:#0e0e0e; }
  body.s-black .back { color:#888; }

  /* ---- black + red-mode fixes: no greys (cream), labels >= 12px bold, EDIT a clear link ---- */
  body.s-blackfix { background:#0e0e0e; color:#f0ece0; }
  body.s-blackfix .prog i { background:#555; } body.s-blackfix .prog i.on { background:#f0ece0; } body.s-blackfix .prog i.done { background:#c8f135; }
  body.s-blackfix .lab { color:#f0ece0; font-weight:700; font-size:11px; } body.s-blackfix .lab b { background:#c8f135; color:#0e0e0e; } body.s-blackfix .lab u { color:#f0ece0; }
  body.s-blackfix h1 em { color:#c8f135; padding:0; }
  body.s-blackfix .sub { color:#f0ece0; }
  body.s-blackfix .c { border:1.5px solid #8a8a8a; border-radius:4px; }
  body.s-blackfix .k { font-size:12px; font-weight:700; letter-spacing:.06em; color:#f0ece0; line-height:15px; }
  body.s-blackfix .v { font-size:13px; line-height:17px; color:#f0ece0; }
  body.s-blackfix .e { font-size:11px; font-weight:700; letter-spacing:.08em; color:#f0ece0; text-decoration:underline; text-decoration-thickness:1.5px; text-underline-offset:3px; }
  body.s-blackfix .next { background:#c8f135; color:#0e0e0e; }
  body.s-blackfix .back { color:#f0ece0; font-weight:700; }

  /* ---- white family shared ---- */
  body.w { background:#f0ece0; color:#0e0e0e; }
  body.w .prog i { height:5px; box-shadow:inset 0 0 0 1.5px #0e0e0e; } body.w .prog i.on { background:#0e0e0e; }
  body.w .lab { color:#0e0e0e; font-weight:700; font-size:11px; } body.w .lab b { background:#c8f135; color:#0e0e0e; } body.w .lab u { color:#0e0e0e; }
  body.w h1 em { background:#c8f135; color:#0e0e0e; }
  body.w .sub { color:#1e1e1e; }
  body.w .k { font-size:11.5px; font-weight:700; letter-spacing:.05em; line-height:14px; color:#0e0e0e; }
  body.w .v { font-size:12px; font-weight:700; line-height:17px; color:#0e0e0e; }
  body.w .e { font-size:10px; font-weight:700; letter-spacing:.08em; color:#0e0e0e; text-decoration:underline; text-decoration-thickness:1.5px; text-underline-offset:3px; }
  body.w .next { background:#c8f135; color:#0e0e0e; }
  body.w .back { color:#0e0e0e; font-weight:700; }
  body.grid-paper { background-image:linear-gradient(rgba(14,14,14,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(14,14,14,.07) 1px, transparent 1px); background-size:16px 16px; }
  body.qtags .k::before { content:counter(q, decimal-leading-zero); display:inline-block; background:#0e0e0e; color:#f0ece0; font:700 8.5px/12px 'Space Mono', monospace; letter-spacing:.02em; padding:0 3px; margin-right:5px; vertical-align:1px; }

  /* A: lab form */
  body.s-A .c { border:2px solid #0e0e0e; background:#fbf9f3; }
  body.s-A .next { border:2px solid #0e0e0e; }
  /* A2: lab form + orange accents (EDIT = orange block, black text) */
  body.s-A2 .c { border:2px solid #0e0e0e; background:#fbf9f3; }
  body.s-A2 .e { background:#FF7A2F; color:#0e0e0e; text-decoration:none; padding:1px 4px; border:1.5px solid #0e0e0e; font-size:9px; }
  body.s-A2 .next { border:2px solid #0e0e0e; }
  /* B: brutalist, thinner outlines (2px + 3px hard shadow), lime answered cards, Bebas labels */
  body.s-B .c { border:2px solid #0e0e0e; border-radius:5px; background:#c8f135; box-shadow:3px 3px 0 #0e0e0e; padding:0 9px; }
  body.s-B .grid { column-gap:11px; row-gap:6px; padding-right:3px; padding-bottom:3px; }
  body.s-B .k { font:400 15px/14px 'Bebas Neue', sans-serif; letter-spacing:.05em; }
  body.s-B .next { border:2px solid #0e0e0e; border-radius:6px; box-shadow:3px 3px 0 #0e0e0e; margin-right:3px; }
  /* AB: lab form x brutalist: graph paper + number tags + mono values, 1.5px boxes with 2px hard shadows, Bebas labels, dark-green-edged NEXT */
  body.s-AB .c { border:1.5px solid #0e0e0e; background:#fbf9f3; box-shadow:2px 2px 0 #0e0e0e; padding:0 8px; }
  body.s-AB .grid { column-gap:11px; row-gap:5px; padding-right:2px; padding-bottom:2px; }
  body.s-AB .k { font:400 15px/14px 'Bebas Neue', sans-serif; letter-spacing:.05em; }
  body.s-AB.qtags .k::before { font-size:8px; line-height:11px; vertical-align:2px; }
  body.s-AB .next { border:2px solid #3f5a00; box-shadow:3px 3px 0 #3f5a00; margin-right:3px; }
  body.s-AB.btn-black .next { border-color:#0e0e0e; box-shadow:3px 3px 0 #0e0e0e; }

  /* &style=all: six phones side by side */
  body.all { background:#0e0e0e; color:#f0ece0; padding:12px 16px; height:auto; }
  body.all h2 { font:400 30px 'Bebas Neue', sans-serif; margin:0 0 8px; letter-spacing:.02em; }
  body.all .row { display:flex; gap:16px; overflow-x:auto; }
  body.all figure { margin:0; flex:none; }
  body.all figcaption { font:700 12px 'Space Mono', monospace; letter-spacing:.08em; margin-bottom:6px; }
  body.all figcaption a { color:#c8f135; }
  body.all .fr { width:393px; height:660px; overflow:hidden; border-radius:6px; transform-origin:0 0; }
  body.all iframe { width:393px; height:660px; border:0; display:block; }
</style>
</head>
<body>
<script>
(function () {
  var Q = new URLSearchParams(location.search);
  var S = String(Q.get('style') || 'AB'); var SU = S.toUpperCase();
  var KNOWN = { BLACK: 'black', BLACKFIX: 'blackfix', A: 'A', A2: 'A2', B: 'B', AB: 'AB', ALL: 'all' };
  var st = KNOWN[SU] || 'AB';
  var B = document.body;
  if (st === 'all') {
    B.className = 'all';
    var v = Q.get('v') ? '&v=' + encodeURIComponent(Q.get('v')) : '';
    var L = [['black', 'Current black (s3y223)'], ['blackfix', 'Black + red-mode fixes'], ['A', 'A · Lab form'], ['A2', 'A2 · Lab + orange'], ['B', 'B · Brutalist (thinner)'], ['AB', 'AB · Lab x Brutalist']];
    var h = '<h2>Who You Are · fully collapsed (20 cards)</h2><div class="row">';
    L.forEach(function (x) { var u = '?style=' + x[0] + v; h += '<figure><figcaption>' + x[1] + ' · <a href="' + u + '" target="_blank">open</a></figcaption><div class="fr"><iframe src="' + u + '"></iframe></div></figure>'; });
    B.innerHTML = h + '</div>';
    var fit = function () { var k = Math.min(1, (innerHeight - 90) / 660); document.querySelectorAll('.fr').forEach(function (f) { f.style.transform = k < 1 ? 'scale(' + k + ')' : ''; f.style.marginBottom = k < 1 ? (660 * (k - 1)) + 'px' : ''; f.style.marginRight = k < 1 ? (393 * (k - 1)) + 'px' : ''; }); };
    addEventListener('resize', fit); fit();
    return;
  }
  var white = /^(A|A2|B|AB)$/.test(st);
  B.className = 's-' + st + (white ? ' w' : '') + (/^(A|A2|AB)$/.test(st) ? ' grid-paper qtags' : '') + (st === 'AB' && Q.get('btn') === 'black' ? ' btn-black' : '');
  var D = [['Gender', 'Woman'], ['Name', 'Amanda Bradford'], ['Date of birth', 'Jan 1, 1984'], ['Location', 'Austin, TX'], ['Marital status', 'Never married'], ['Have kids', 'Yes (2)'],
    ['Last breakup', 'Aug 2026'], ['Height', '5\u201910\u201d'], ['Race', 'White'], ['Education', 'MBA'], ['Industry', 'Marketing'], ['Title', 'Founder ceo'],
    ['Income', '$100k\u2013150k'], ['Religion', 'Christian \u00b7 Non-denominational'], ['Politics', 'Moderate'], ['Languages', 'English +1'], ['Sports', 'Volleyball, Running'],
    ['Instruments', 'Guitar, Voice'], ['Interests', 'Live Music, Hiking'], ['Email', 'amanda.bradford@gmail.com']];
  var esc = function (s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;'); };
  var html = '<div class="ph"><div class="prog">' + [0, 1, 2, 3, 4, 5].map(function (i) { return '<i class="' + (i === 0 ? 'on' : '') + '"></i>'; }).join('') + '</div>' +
    '<div class="lab">Step 1 of 6 &nbsp;\u00b7&nbsp; <b>SINGLE</b> &nbsp;\u00b7&nbsp; <u>edit</u></div>' +
    '<h1>Who you <em>are</em></h1><p class="sub">Data is private by default. Change visibility later.</p><div class="grid">' +
    D.map(function (d) { return '<div class="c" role="button" tabindex="0" aria-label="Edit ' + esc(d[0]) + '"><span class="k">' + esc(d[0]) + '</span><span class="v" title="' + esc(d[1]) + '">' + esc(d[1]) + '</span><span class="e">Edit</span></div>'; }).join('') +
    '</div><div class="bot"><button class="next" type="button">NEXT</button><button class="back" type="button">\u2190 BACK</button></div></div>';
  B.innerHTML = html;
})();
</script>
</body>
</html>
