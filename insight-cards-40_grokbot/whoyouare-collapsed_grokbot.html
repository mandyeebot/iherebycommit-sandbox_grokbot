<!DOCTYPE html>
<html lang="en">
<head>

<title>Who You Are · fully collapsed · styles</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* Static mock of Sandbox 2 (s3y223) Who You Are, every question answered = 20 collapsed cards. &style=black|blackfix|A|A2|B|AB|AB2|all */
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body { font-family:'Space Mono', monospace; -webkit-text-size-adjust:100%; }
  .ph { height:100vh; height:100dvh; max-height:100%; display:flex; flex-direction:column; padding:12px 24px calc(env(safe-area-inset-bottom, 0px) + 4px); overflow:hidden; }
  .prog { display:flex; gap:5px; flex:none; }
  .prog i { flex:1; height:3px; }
  .lab { flex:none; margin-top:11px; font-size:10px; letter-spacing:.15em; text-transform:uppercase; line-height:15px; white-space:nowrap; }
  .lab b { font-weight:700; padding:1px 5px; letter-spacing:.12em; }
  .lab u { text-underline-offset:3px; }
  h1 { flex:none; margin:6px 0 0; font:400 52px/0.95 'Bebas Neue', sans-serif; letter-spacing:.02em; }
  h1 em { font-style:normal; padding:0 .06em; }
  .sub { flex:none; margin:6px 0 10px; font-size:10.75px; line-height:16px; white-space:nowrap; }
  .grid { flex:1; min-height:0; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:repeat(10, minmax(0, 1fr)); column-gap:10px; row-gap:4px; counter-reset:q; }
  .c { min-width:0; min-height:0; display:grid; grid-template-columns:minmax(0,1fr) auto; grid-template-rows:auto auto; align-content:center; column-gap:4px; padding:0 9px; counter-increment:q; overflow:hidden; }
  .k { grid-column:1 / 3; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-transform:uppercase; }
  .v { min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .e { align-self:center; text-transform:uppercase; white-space:nowrap; cursor:pointer; background:none; border:0; padding:0; font-family:inherit; }
  .bot { flex:none; padding-top:8px; display:flex; flex-direction:column; align-items:stretch; }
  .next { border:0; font:400 22px/1 'Bebas Neue', sans-serif; letter-spacing:.1em; padding:15px 0 13px; }
  .back { background:none; border:0; font:12px 'Space Mono', monospace; letter-spacing:.08em; padding:8px 0 6px; }

  /* ---- black: current s3y223 ---- */
  .s-black body, body.s-black { background:#0e0e0e; color:#f0ece0; }
  body.s-black .prog i { background:#2a2a2a; } body.s-black .prog i.on { background:#f0ece0; }
  body.s-black .lab { color:#888; } body.s-black .lab b { background:#c8f135; color:#0e0e0e; } body.s-black .lab u { color:#888; }
  body.s-black h1 em { color:#c8f135; padding:0; }
  body.s-black .sub { color:#888; }
  body.s-black .c { border:1px solid #333; border-radius:4px; }
  body.s-black .k { font-size:10px; letter-spacing:.15em; color:#888; line-height:14px; }
  body.s-black .v { font-size:13px; line-height:18px; color:#f0ece0; }
  body.s-black .e { font-size:10px; letter-spacing:.15em; color:#888; text-decoration:underline; text-underline-offset:3px; }
  body.s-black .next { background:#c8f135; color:#0e0e0e; }
  body.s-black .back { color:#888; }

  /* ---- black + red-mode fixes: no greys (cream), labels >= 12px bold, EDIT a clear link ---- */
  body.s-blackfix { background:#0e0e0e; color:#f0ece0; }
  body.s-blackfix .prog i { background:#555; } body.s-blackfix .prog i.on { background:#f0ece0; } body.s-blackfix .prog i.done { background:#c8f135; }
  body.s-blackfix .lab { color:#f0ece0; font-weight:700; font-size:11px; } body.s-blackfix .lab b { background:#c8f135; color:#0e0e0e; } body.s-blackfix .lab u { color:#f0ece0; }
  body.s-blackfix h1 em { color:#c8f135; padding:0; }
  body.s-blackfix .sub { color:#f0ece0; }
  body.s-blackfix .c { border:1.5px solid #8a8a8a; border-radius:4px; }

  body.s-blackfix .v { font-size:13px; line-height:17px; color:#f0ece0; }
  body.s-blackfix .e { font-size:11px; font-weight:700; letter-spacing:.08em; color:#f0ece0; text-decoration:underline; text-decoration-thickness:1.5px; text-underline-offset:3px; }
  body.s-blackfix .next { background:#c8f135; color:#0e0e0e; }

  /* ---- white family shared ---- */

  body.w .sub { color:#1e1e1e; }
  body.w .k { font-size:11.5px; font-weight:700; letter-spacing:.05em; line-height:14px; color:#0e0e0e; }
  body.w .v { font-size:12px; font-weight:700; line-height:17px; color:#0e0e0e; }
  body.w .e { font-size:10px; font-weight:700; letter-spacing:.08em; color:#0e0e0e; text-decoration:underline; text-decoration-thickness:1.5px; text-underline-offset:3px; }
  body.w .next { background:#c8f135; color:#0e0e0e; }
  body.w .back { color:#0e0e0e; font-weight:700; }
  body.grid-paper { background-image:linear-gradient(rgba(14,14,14,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(14,14,14,.07) 1px, transparent 1px); background-size:16px 16px; }
  body.qtags .k::before { content:counter(q, decimal-leading-zero); display:inline-block; background:#0e0e0e; color:#f0ece0; font:700 8.5px/12px 'Space Mono', monospace; letter-spacing:.02em; padding:0 3px; margin-right:5px; vertical-align:1px; }

  /* A: lab form */
  body.s-A .c { border:2px solid #0e0e0e; background:#fbf9f3; }
  body.s-A .next { border:2px solid #0e0e0e; }
  /* A2: lab form + orange accents (EDIT = orange block, black text) */
  body.s-A2 .c { border:2px solid #0e0e0e; background:#fbf9f3; }
  body.s-A2 .e { background:#FF7A2F; color:#0e0e0e; text-decoration:none; padding:1px 4px; border:1.5px solid #0e0e0e; font-size:9px; }
  body.s-A2 .next { border:2px solid #0e0e0e; }
  /* B: brutalist, thinner outlines (2px + 3px hard shadow), lime answered cards, Bebas labels */
  body.s-B .c { border:2px solid #0e0e0e; border-radius:5px; background:#fffdf7; box-shadow:3px 3px 0 #0e0e0e; padding:0 9px; }
  body.s-B .grid { column-gap:11px; row-gap:6px; padding-right:3px; padding-bottom:3px; }
  body.s-B .k { font:400 15px/14px 'Bebas Neue', sans-serif; letter-spacing:.05em; }
  body.s-B .next { border:2px solid #0e0e0e; border-radius:6px; box-shadow:3px 3px 0 #0e0e0e; margin-right:3px; }
  /* AB: lab form x brutalist: graph paper + number tags + mono values, 1.5px boxes with 2px hard shadows, Bebas labels, dark-green-edged NEXT */
  body.s-AB .c { border:1.5px solid #0e0e0e; background:#fbf9f3; box-shadow:2px 2px 0 #0e0e0e; padding:0 8px; }
  body.s-AB .grid { column-gap:11px; row-gap:5px; padding-right:2px; padding-bottom:2px; }
  body.s-AB .k { font:400 15px/14px 'Bebas Neue', sans-serif; letter-spacing:.05em; }
  body.s-AB.qtags .k::before { font-size:8px; line-height:11px; vertical-align:2px; }
  body.s-AB .next { border:2px solid #3f5a00; box-shadow:3px 3px 0 #3f5a00; margin-right:3px; }
  body.s-AB.btn-black .next { border-color:#0e0e0e; box-shadow:3px 3px 0 #0e0e0e; }

  /* AB2: AB + EDIT as bold orange text, no block/pill/border. #E05A10 = brand orange one step darker for cream (3.7:1; #FF7A2F is 2.6:1). &edit=brand = exact #FF7A2F */
  body.s-AB2 .c { border:1.5px solid #0e0e0e; background:#fbf9f3; box-shadow:2px 2px 0 #0e0e0e; padding:0 8px; }
  body.s-AB2 .grid { column-gap:11px; row-gap:5px; padding-right:2px; padding-bottom:2px; }
  body.s-AB2 .k { font:400 15px/14px 'Bebas Neue', sans-serif; letter-spacing:.05em; }
  body.s-AB2.qtags .k::before { font-size:8px; line-height:11px; vertical-align:2px; }
  body.s-AB2 .e { color:#E05A10; font-size:12px; font-weight:700; letter-spacing:.06em; text-decoration:none; }
  body.s-AB2.edit-brand .e { color:#FF7A2F; }
  body.s-AB2 .next { border:2px solid #3f5a00; box-shadow:3px 3px 0 #3f5a00; margin-right:3px; }
  body.s-AB2.btn-black .next { border-color:#0e0e0e; box-shadow:3px 3px 0 #0e0e0e; }

  /* blackfix2 = blackfix + EDIT as bold orange text, no block */
  body.s-blackfix.bf2 .e { color:#FF7A2F; font-size:12px; text-decoration:none; letter-spacing:.06em; }
  /* AB2dark = AB2 inverted onto black: dark graph paper, near-black cards w/ 1.5px cream outline, cream text (no grey), cream number tags, bold orange EDIT, lime NEXT (green edge dropped: #3f5a00 is 2.5:1 on black) */
  body.s-AB2dark { background:#0e0e0e; color:#f0ece0; background-image:linear-gradient(rgba(240,236,224,.075) 1px, transparent 1px), linear-gradient(90deg, rgba(240,236,224,.075) 1px, transparent 1px); /* = page 0 p0=2&bg=lab */ background-size:16px 16px; }
  body.s-AB2dark .prog i { height:5px; box-shadow:inset 0 0 0 1.5px #f0ece0; } body.s-AB2dark .prog i.on { background:#f0ece0; }
  body.s-AB2dark .lab { color:#f0ece0; font-weight:700; font-size:11px; } body.s-AB2dark .lab b { background:#c8f135; color:#0e0e0e; } body.s-AB2dark .lab u { color:#f0ece0; }
  body.s-AB2dark h1 em { background:#c8f135; color:#0e0e0e; }
  body.s-AB2dark .sub { color:#f0ece0; }
  body.s-AB2dark .grid { column-gap:11px; row-gap:5px; padding-right:2px; padding-bottom:2px; }
  body.s-AB2dark .c { border:1.5px solid #f0ece0; background:#161616; box-shadow:2px 2px 0 rgba(240,236,224,.35); padding:0 8px; }
  body.s-AB2dark .k { font:400 15px/14px 'Bebas Neue', sans-serif; letter-spacing:.05em; color:#f0ece0; text-transform:uppercase; }
  body.s-AB2dark.qtags .k::before { background:#f0ece0; color:#0e0e0e; font-size:8px; line-height:11px; vertical-align:2px; }
  body.s-AB2dark .v { font-size:12px; font-weight:700; line-height:17px; color:#f0ece0; }
  body.s-AB2dark .e { color:#FF7A2F; font-size:12px; font-weight:700; letter-spacing:.06em; text-decoration:none; }
  body.s-AB2dark .next { background:#c8f135; color:#0e0e0e; }
  body.s-AB2dark .back { color:#f0ece0; font-weight:700; }
  /* &state=inprogress: Have kids answered (card), Last relationship = active question (lime band, black text, cream select) */
  .act { grid-column:1 / 3; padding:8px 10px 10px; background:#c8f135; color:#0e0e0e; border:2px solid #0e0e0e; }
  .act .q { font:700 12px/16px 'Space Mono', monospace; letter-spacing:.05em; text-transform:uppercase; margin-bottom:7px; }
  .act .sel { background:#fffdf7; color:#0e0e0e; border:2px solid #0e0e0e; text-align:center; font:700 13px/1 'Space Mono', monospace; padding:13px 0; }
  .ip .grid { grid-template-rows:auto auto 1fr; } .ip .c { min-height:40px; } .ip .grid > .spacer { grid-column:1 / 3; }
  body.couple .act { background:#FF7A2F; } body.couple .lab b, body.couple:not(.s-form) .next { background:#FF7A2F !important; } body.couple h1 em { background:#FF7A2F; color:#0e0e0e !important; padding:0 .06em !important; }
  body.w.qtags .act .q::before, body.s-AB2dark.qtags .act .q::before { content:'02'; background:#0e0e0e; color:#f0ece0; font-size:8.5px; padding:0 3px; margin-right:5px; vertical-align:1px; }
  body.s-B .act, body.s-AB .act, body.s-AB2 .act { box-shadow:3px 3px 0 #0e0e0e; }
  body.s-AB2dark .act { box-shadow:3px 3px 0 rgba(240,236,224,.35); border-color:#0e0e0e; }
  body.s-black .act, body.s-blackfix .act { border:0; border-radius:4px; }

  /* form = the FORM ROWS above the signature on p0=2w&sign=1: plain cream, bold mono labels, lime chips (selected/answer = black chip, lime text), lime input bars, thin black rules, black I-HEREBY-COMMIT style NEXT. Couples: orange for lime */
  body.s-form { background:#f0ece0; color:#0e0e0e; --hi:#c8f135; }
  body.s-form.couple { --hi:#FF7A2F; }
  body.s-form .prog i { height:3px; background:rgba(14,14,14,.18); } body.s-form .prog i.on { background:#0e0e0e; }
  body.s-form .lab { color:#0e0e0e; font-weight:700; font-size:11px; } body.s-form .lab b { background:var(--hi); color:#0e0e0e; } body.s-form .lab u { color:#0e0e0e; }
  body.s-form h1 em { background:var(--hi); color:#0e0e0e; }
  body.s-form .sub { color:#0e0e0e; margin-bottom:8px; }
  body.s-form .grid { border-top:1.5px solid #0e0e0e; border-bottom:1.5px solid #0e0e0e; padding:6px 0; row-gap:3px; column-gap:12px; }
  body.s-form .c { padding:0; column-gap:6px; row-gap:2px; }
  body.s-form .k { grid-column:1; font:700 12px/14px 'Space Mono', monospace; letter-spacing:.04em; color:#0e0e0e; }
  body.s-form .e { grid-column:2; grid-row:1; color:#E05A10; font:700 12px/14px 'Space Mono', monospace; letter-spacing:.06em; text-decoration:none; }
  body.s-form.couple .e { color:#0e0e0e; text-decoration:underline; text-decoration-thickness:1.5px; text-underline-offset:2px; }
  body.s-form .v { grid-column:1 / 3; background:#0e0e0e; color:var(--hi); font:400 16px/1 'Bebas Neue', sans-serif; letter-spacing:.04em; text-transform:uppercase; border-radius:5px; padding:4px 8px 3px; }
  body.s-form .next { background:#0e0e0e; color:var(--hi); font-size:26px; padding:14px 0 12px; border-radius:6px; }
  body.s-form .back { color:#0e0e0e; font-weight:700; }
  body.s-form .act { background:transparent; border:0; border-top:1.5px solid #0e0e0e; padding:8px 0 0; box-shadow:none; }
  body.s-form .act .q { font-size:12px; }
  body.s-form .act .q::before { content:none !important; }
  body.s-form .act .opts { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  body.s-form .act .opts span { background:var(--hi); color:#0e0e0e; font:400 17px/1 'Bebas Neue', sans-serif; letter-spacing:.04em; text-align:center; border-radius:5px; padding:9px 0 7px; }
  body.s-form.ip .grid { border-bottom:0; }
  body.s-form.ip .c { grid-template-columns:auto minmax(0,1fr) auto; align-items:center; column-gap:10px; }

  /* &edit=pencil: orange pencil icon instead of EDIT text (any style). 15px glyph, 32x32 tap target via invisible padding, value gets the freed width */
  body.pen { --pen:#E05A10; }
  body.pen.s-AB2dark, body.pen.s-blackfix, body.pen.s-black { --pen:#FF7A2F; }
  body.pen.couple { --pen:#0e0e0e; } body.pen.couple.s-AB2dark, body.pen.couple.s-blackfix, body.pen.couple.s-black { --pen:#f0ece0; }
  body.pen .c { column-gap:4px; padding-left:6px !important; padding-right:6px !important; }
  body.pen .grid { column-gap:8px !important; }
  body.pen .v { letter-spacing:-.4px; }
  body.pen.s-form .c { padding-left:0 !important; padding-right:0 !important; }
  body.pen .e.pn { grid-column:2; grid-row:2; align-self:center; position:relative; display:flex; align-items:center; justify-content:center; width:14px; height:14px; margin:0; padding:0; color:var(--pen) !important; background:none !important; border:0 !important; text-decoration:none !important; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  body.pen .e.pn svg { width:14px; height:14px; display:block; }
  body.pen .e.pn::after { content:''; position:absolute; left:50%; top:50%; width:32px; height:32px; transform:translate(-50%, -50%); }
  body.pen.s-form .e.pn { grid-row:2; }
  body.pen.s-form .v { grid-column:1; }
  body.pen.s-form.ip .c .e.pn { grid-column:3; grid-row:1; }
  body.pen.s-form.ip .c .v { grid-column:2; }

  /* &grid=soft: half-opacity grid lines for comparison */
  body.gsoft.grid-paper { background-image:linear-gradient(rgba(14,14,14,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(14,14,14,.035) 1px, transparent 1px); }
  body.gsoft.s-AB2dark { background-image:linear-gradient(rgba(240,236,224,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(240,236,224,.04) 1px, transparent 1px); }

  /* blackfix &border=soft (1px #6a6a6a) / &border=softer (1px #555); default 1.5px #8a8a8a */
  body.s-blackfix.bd-soft .c { border:1px solid #6a6a6a; }
  body.s-blackfix.bd-softer .c { border:1px solid #555; }

  /* &penpos=mid (default with pencil): pencil centred on the whole card, label + value both stop before it; &penpos=bottom = on the value line */
  body.pen.pmid .k { grid-column:1; }
  body.pen.pmid .e.pn { grid-row:1 / 3; align-self:center; }
  body.pen.pmid.s-form.ip .c .e.pn { grid-row:1; }
  /* &grid=mid: between soft and current */
  body.gmid.grid-paper { background-image:linear-gradient(rgba(14,14,14,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(14,14,14,.05) 1px, transparent 1px); }
  body.gmid.s-AB2dark { background-image:linear-gradient(rgba(240,236,224,.055) 1px, transparent 1px), linear-gradient(90deg, rgba(240,236,224,.055) 1px, transparent 1px); }

  /* &pencolor=green: lime pencil */
  body.pen.pgreen { --pen:#c8f135; }

  /* &penweight=bold: 16px pencil, 2.75px stroke (pencil 2) */
  body.pen.pbold .e.pn { width:16px; height:16px; }
  body.pen.pbold .e.pn svg { width:16px; height:16px; }

  /* &style=all: six phones side by side */
  body.all { background:#0e0e0e; color:#f0ece0; padding:12px 16px; height:auto; }
  body.all h2 { font:400 30px 'Bebas Neue', sans-serif; margin:0 0 8px; letter-spacing:.02em; }
  body.all .row { display:flex; gap:16px; overflow-x:auto; }
  body.all figure { margin:0; flex:none; }
  body.all figcaption { font:700 12px 'Space Mono', monospace; letter-spacing:.08em; margin-bottom:6px; }
  body.all figcaption a { color:#c8f135; }
  body.all .fr { width:393px; height:660px; overflow:hidden; border-radius:6px; transform-origin:0 0; }
  body.all iframe { width:393px; height:660px; border:0; display:block; }

  /* AB2flat (Amanda Oct 20): AB2 exactly, minus every hard shadow; NEXT = lime with a flat 1.5px black rule */
  body.s-AB2flat .c { border:1.5px solid #0e0e0e; background:#fbf9f3; box-shadow:none; padding:0 8px; }
  body.s-AB2flat .grid { column-gap:11px; row-gap:5px; }
  body.s-AB2flat .k { font:400 15px/14px 'Bebas Neue', sans-serif; letter-spacing:.05em; }
  body.s-AB2flat .e { color:#E05A10; font-size:12px; font-weight:700; letter-spacing:.06em; text-decoration:none; }
  body.s-AB2flat .next { border:1.5px solid #0e0e0e; box-shadow:none; }
  /* &accent2 (Amanda Oct 21, AB2flat): one structural accent beside lime - filled step segment, SINGLE tag, subtitle band */
  body.s-AB2flat.a2 .prog i.on { background:var(--a2); }
  body.s-AB2flat.a2 .lab b { background:var(--a2); }
  body.s-AB2flat.a2 .sub { background:var(--a2); box-shadow:-6px 0 0 var(--a2), 6px 0 0 var(--a2); width:fit-content; margin-left:6px; }
</style>
</head>
