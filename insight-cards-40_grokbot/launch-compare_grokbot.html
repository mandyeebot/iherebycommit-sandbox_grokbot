<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launch compare · black vs white AB</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; background:#0e0e0e; color:#f0ece0; font-family:'Space Mono', monospace; }
  header { padding:12px 16px 6px; display:flex; flex-wrap:wrap; align-items:center; gap:8px 16px; }
  h1 { font-family:'Bebas Neue', sans-serif; font-size:32px; margin:0; letter-spacing:.02em; line-height:1; }
  h1 span { background:#c8f135; color:#0e0e0e; padding:0 .08em; }
  nav { display:flex; gap:6px; flex-wrap:wrap; }
  nav a, nav button { color:#0e0e0e; background:#f0ece0; border:0; text-decoration:none; font:700 12px 'Space Mono', monospace; padding:6px 10px; letter-spacing:.06em; cursor:pointer; }
  nav .on { background:#c8f135; }
  nav button.red.on { background:#ff2a2a; color:#0e0e0e; }
  .grid { display:flex; gap:16px; padding:8px 16px 24px; overflow-x:auto; align-items:flex-start; }
  figure { margin:0; flex:none; }
  figcaption { font-size:12px; font-weight:700; letter-spacing:.08em; margin:0 0 6px; text-transform:uppercase; }
  figcaption a { color:#c8f135; }
  .frame { position:relative; width:393px; height:660px; overflow:hidden; border-radius:6px; transform-origin:0 0; }
  .frame iframe { width:393px; height:660px; border:0; display:block; background:#0e0e0e; }
  /* red Color Tint approximation: greyscale the page, then multiply by pure red = luminance mapped to the red channel */
  .frame .tint { display:none; position:absolute; inset:0; background:#ff0000; mix-blend-mode:multiply; pointer-events:none; }
  body.red .frame iframe { filter:grayscale(1); }
  body.red .frame .tint { display:block; }
  .note { font-size:11px; padding:0 16px 16px; max-width:820px; line-height:1.5; }
</style>
</head>
<body>
<header>
  <h1>Black <span>vs</span> White AB</h1>
  <nav id="nav"></nav>
</header>
<div class="grid" id="grid"></div>
<p class="note" id="note"></p>
<script>
  var Q = new URLSearchParams(location.search);
  var STEP = Q.get('step') || 'whatyouwant';
  var V = Q.get('v') || '';
  var BV = Q.get('bv') || V;
  var BTN = Q.get('btn') || '';
  var PATH = Q.get('path') || '';
  var RED = Q.get('red') === '1';
  if (RED) document.body.classList.add('red');
  var VIEWS = { whatyouwant: ['step=whatyouwant', 'step=whatyouwant'], whoyouare: ['step=whoyouare', 'step=whoyouare'], whoyouare_filled: ['step=whoyouare', 'step=whoyouare&demo=filled'], page0: ['p0=2', 'p0=2w'] };
  var nav = document.getElementById('nav');
  function link(txt, key, val, on) { var a = document.createElement('a'); a.textContent = txt; var p = new URLSearchParams(Q); if (val === null) p.delete(key); else p.set(key, val); a.href = '?' + p.toString(); if (on) a.className = 'on'; nav.appendChild(a); }
  Object.keys(VIEWS).forEach(function (k) { link(k.replace('_', ' ').toUpperCase(), 'step', k, k === STEP); });
  link('SINGLE', 'path', null, !PATH); link('COUPLE', 'path', 'couple', !!PATH);
  link('BTN GREEN', 'btn', null, BTN !== 'black'); link('BTN BLACK', 'btn', 'black', BTN === 'black');
  var rb = document.createElement('button'); rb.className = 'red' + (RED ? ' on' : ''); rb.textContent = RED ? 'RED FILTER: ON' : 'RED FILTER: OFF';
  rb.onclick = function () { var on = document.body.classList.toggle('red'); rb.classList.toggle('on', on); rb.textContent = on ? 'RED FILTER: ON' : 'RED FILTER: OFF'; var p = new URLSearchParams(location.search); if (on) p.set('red', '1'); else p.delete('red'); history.replaceState(null, '', '?' + p.toString()); };
  nav.appendChild(rb);
  var vw = VIEWS[STEP] || VIEWS.whatyouwant;
  var extra = (PATH ? '&path=' + encodeURIComponent(PATH) : '');
  var F = [
    ['Current black (live)', 'onboarding-page0_grokbot.html?' + vw[0] + extra + (BV ? '&v=' + encodeURIComponent(BV) : '')],
    ['White AB', 'white-styles_grokbot.html?' + vw[1] + '&wstyle=AB' + (BTN ? '&btn=' + encodeURIComponent(BTN) : '') + extra + (V ? '&v=' + encodeURIComponent(V) : '')]
  ];
  var g = document.getElementById('grid');
  F.forEach(function (f) {
    var fig = document.createElement('figure');
    fig.innerHTML = '<figcaption>' + f[0] + ' · <a href="' + f[1] + '" target="_blank">open</a></figcaption><div class="frame"><iframe src="' + f[1] + '"></iframe><div class="tint"></div></div>';
    g.appendChild(fig);
  });
  // fit both 393x660 phones on screen (iPhone Safari leaves ~550px under its toolbars)
  function fit() { var head = document.querySelector('header').offsetHeight + 40; var k = Math.min(1, (window.innerHeight - head) / 660, (window.innerWidth - 48) / (393 * 2 + 16));
    document.querySelectorAll('figure').forEach(function (fg) { var fr = fg.querySelector('.frame'); fr.style.transform = k < 1 ? 'scale(' + k + ')' : ''; fg.style.width = (393 * k) + 'px'; fg.style.height = (660 * k + 24) + 'px'; }); }
  window.addEventListener('resize', fit); fit();
  document.getElementById('note').textContent = 'Red filter = greyscale x pure red (luminance mapped to the red channel), close to iPhone Color Filters > Color Tint with Intensity and Hue at max. Frames scale down to fit the screen; each frame is still a 393x660 phone inside.';
</script>
</body>
</html>
