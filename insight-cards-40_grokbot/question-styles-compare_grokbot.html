<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Question styles A–F · compare</title>
<!-- MOCKUP_grokbot (Oct 19 2026): every question style side by side at 393x660. ?theme=white &path=couple &sheet=legal|degree|kids|industry -->
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
body { margin:0; padding:20px; background:#262624; color:#f0ece0; font-family:'Space Mono', monospace; }
h1 { font:400 40px/1 'Bebas Neue', sans-serif; letter-spacing:.02em; margin:0 0 6px; }
.bar { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 18px; font-size:12px; align-items:center; }
.bar a { color:#f0ece0; border:1.5px solid #f0ece0; padding:6px 10px; text-decoration:none; border-radius:4px; }
.bar a.on { background:#c8f135; color:#0e0e0e; border-color:#c8f135; font-weight:700; }
.bar span { margin-left:8px; letter-spacing:.12em; }
.grid { display:flex; flex-wrap:wrap; gap:22px; }
.cell { width:393px; }
.lab { font-size:13px; margin:0 0 8px; min-height:38px; } .lab b { background:#c8f135; color:#0e0e0e; padding:1px 6px; margin-right:6px; }
iframe { width:393px; height:660px; border:0; display:block; background:#0e0e0e; }
.lab a { color:#c8f135; }
</style>
</head>
<body>
<h1>Question vs answer styles</h1>
<div class="bar" id="bar"></div>
<div class="grid" id="grid"></div>
<script>
var P = new URLSearchParams(location.search);
var theme = P.get('theme') === 'white' ? 'white' : 'black', path = P.get('path') === 'couple' ? 'couple' : 'single', sheet = P.get('sheet') || 'legal', v = P.get('v') || '';
var NAMES = { A: 'Section header: condensed caps, like YOUR LAST RELATIONSHIP', B: 'Highlight block: whole question on a solid block', B2: 'Highlight block, about 20% smaller with tighter blocks', C: 'Key phrase highlight: only the key words on a block', D: 'Coloured question (white: black + thick underline bar)', E: 'Research questionnaire: Q chip, bold sans, hairline, indented answers', E2: 'Research questionnaire in caps: Q chip, Bebas caps question, hairline, indented answers', F: 'Header band: the question area is a solid colour panel', F2: 'Header band, about 20% smaller with a slimmer band' };
function link(k, val, label) { var q = { theme: theme, path: path, sheet: sheet }; q[k] = val; var on = q[k] === ({ theme: theme, path: path, sheet: sheet })[k];
  var s = '?sheet=' + q.sheet + (q.theme === 'white' ? '&theme=white' : '') + (q.path === 'couple' ? '&path=couple' : '') + (v ? '&v=' + v : '');
  return '<a class="' + (val === ({ theme: theme, path: path, sheet: sheet })[k] ? 'on' : '') + '" href="' + s + '">' + label + '</a>'; }
document.getElementById('bar').innerHTML = '<span>SHEET</span>' + ['legal', 'degree', 'kids', 'industry'].map(function (x) { return link('sheet', x, x); }).join('') +
  '<span>THEME</span>' + link('theme', 'black', 'black') + link('theme', 'white', 'white') + '<span>PATH</span>' + link('path', 'single', 'singles (lime)') + link('path', 'couple', 'couples (orange)');
document.getElementById('grid').innerHTML = ['A', 'B', 'B2', 'C', 'D', 'E', 'E2', 'F', 'F2'].map(function (s) {
  var u = 'question-styles_grokbot.html?qstyle=' + s + '&sheet=' + sheet + (theme === 'white' ? '&theme=white' : '') + (path === 'couple' ? '&path=couple' : '') + (v ? '&v=' + v : '');
  return '<div class="cell"><p class="lab"><b>' + s + '</b>' + NAMES[s] + ' · <a href="' + u + '" target="_blank">open</a></p><iframe src="' + u + '" loading="lazy" title="Style ' + s + '"></iframe></div>';
}).join('');
</script>
</body>
</html>
