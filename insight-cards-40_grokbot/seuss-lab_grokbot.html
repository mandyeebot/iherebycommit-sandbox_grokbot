*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:'Space Mono',monospace;color:#0e0e0e;-webkit-text-size-adjust:100%}
.ph{height:100vh;height:100dvh;display:flex;flex-direction:column;padding:12px 20px calc(env(safe-area-inset-bottom,0px) + 8px);overflow:hidden;position:relative}

.k,.v{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.v{font:700 11.5px/16px 'Space Mono';grid-column:1}

/* ===== A · SPECIMEN: cream grid paper, Luckiest Guy display, teal specimen tags, numbered figure labels, 2px rules + hard shadow ===== */
.o-specimen{background:linear-gradient(rgba(14,14,14,.07) 1px,transparent 1px) 0 0/16px 16px,linear-gradient(90deg,rgba(14,14,14,.07) 1px,transparent 1px) 0 0/16px 16px #f0ece0}

.o-specimen h1{font:400 50px/.95 'Luckiest Guy';margin:8px 0 0;letter-spacing:.01em;transform:rotate(-1.5deg)}
.o-specimen h1 em{font-style:normal;background:#c8f135;padding:0 6px;border:2px solid #0e0e0e;border-radius:12px;display:inline-block;transform:rotate(3deg)}
.o-specimen .c{background:#fbf9f3;border:2px solid #0e0e0e;border-radius:10px;box-shadow:3px 3px 0 #0e0e0e;counter-increment:s}
.o-specimen .grid{counter-reset:s;padding:0 3px 3px 0}
.o-specimen .k{font:400 13px/15px 'Luckiest Guy';letter-spacing:.04em;padding-top:2px}
.o-specimen .k::before{content:"SP-" counter(s,decimal-leading-zero);font:700 8px/11px 'Space Mono';background:#3BA7A5;border:1px solid #0e0e0e;border-radius:6px;padding:0 3px;margin-right:5px;vertical-align:2px}
.o-specimen .pn{color:#E05A10}
.o-specimen .btn{background:#c8f135;border:2.5px solid #0e0e0e;border-radius:16px;box-shadow:4px 4px 0 #0e0e0e;font:400 26px/1 'Luckiest Guy';padding:13px 0 9px;letter-spacing:.06em;width:calc(100% - 4px)}
.o-specimen .pl{font-family:'Luckiest Guy';--fs:21px;line-height:1.16}
.o-specimen .pl .b{background:#0e0e0e;color:#c8f135;border-radius:7px;padding:1px 5px 0}

.o-specimen .sig{background:#c8f135;border:2px solid #0e0e0e;border-radius:12px}
.o-specimen .cont div{background:#c8f135;border:2px solid #0e0e0e;border-radius:10px}

/* ===== B · WHIMSY GRID: Cat-in-the-Hat stripes, Chewy display, bouncy pill cards with teal wavy edge, lab dot-grid ===== */

.o-whimsy .c{background:#fff;border:2px solid #0e0e0e;border-radius:99px;padding:0 12px;box-shadow:inset 0 -4px 0 #3BA7A5}
