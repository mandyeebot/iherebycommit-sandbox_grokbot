<style>
/* Static mockups Oct 21 2026. Copy = existing page 0 pledge copy only (seuss-lab opt=ab2flat screen=p0), split/reordered. */
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{--p:#F4EFE2;--i:#141413;--l:#C8F135;--m:#6FD3BC;--mp:#DFF4EE;--o:#FF7A2F;--card:#fbf9f3;--r:1.5px solid var(--i);

.af .frame{border:var(--r);outline:var(--r);outline-offset:3px;margin:8px 3px 0;padding:10px 12px;flex:none;background:var(--card)}

.st .big{font-size:4.4em;margin:0;line-height:.86}

.st .vw{font:1.6em/1.02 'Bebas Neue';margin:.3em 0 0}

<script>
(function(){

 h='<div class="ph">'+top+'<div class="frame fit"><h1 class="hd">I hereby commit</h1><div class="rule"></div><ol>'+
 '<li><span>I, '+b('Amanda Bradford')+', '+b(ST+' \u25be')+'</span></li>'+

 '<div class="c w"><span class="fig">domiciled in</span><span class="v">Austin, TX</span></div></div>'+

 h='<div class="ph">'+top+'<div class="poster fit" style="position:relative"><div class="seal">'+(C?'Couple':'Single')+'<br>Step 1<br>of 7</div><h1 class="hd big">I, Amanda<br>Bradford,</h1>'+

}
B.innerHTML=h;
function fit(){var f=B.querySelector('.fit'),ph=B.querySelector('.ph'),lo=9,hi=26;
 for(var k=0;k<14;k++){var m=(lo+hi)/2;f.style.setProperty('--fs',m+'px');(ph.scrollHeight>ph.clientHeight+0.5||f.scrollWidth>f.clientWidth+1)?hi=m:lo=m;}
 f.style.setProperty('--fs',(lo-.1)+'px');B.dataset.fs=lo.toFixed(1);}
fit();(document.fonts&&document.fonts.ready.then(fit));addEventListener('resize',fit);
})();
</script></body></html>
