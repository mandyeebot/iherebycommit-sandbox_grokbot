<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Your pool · V2C Dots pour · sandbox mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0f2e;--text:#f4f1ff;--muted:#9da3d6;--lime:#c8f135}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:'Space Mono',monospace;font-size:14px;line-height:1.45}
body{background:radial-gradient(90% 40% at 50% 0%,#2a1f6b 0%,transparent 70%),radial-gradient(80% 40% at 50% 100%,#0f4a4a 0%,transparent 70%),var(--bg);min-height:100vh}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
#app{max-width:430px;margin:0 auto;padding:0 20px;min-height:100vh;display:flex;flex-direction:column}
.prog{display:flex;gap:4px;padding:18px 0 0}.prog i{flex:1;height:3px;background:#262a5c;border-radius:3px}.prog i.d{background:var(--lime)}.prog i.a{background:var(--text)}
.appl{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;padding:10px 0 0}.appl b{color:var(--lime)}
.lbl{display:inline-block;margin:14px 0 4px;padding:3px 9px;border-radius:4px;font-size:9.5px;letter-spacing:.14em;font-weight:700;color:var(--lime);border:1px solid var(--lime)}
h1{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:62px;line-height:.9}
h1 .d{display:inline-block;width:.42em;height:.42em;border-radius:50%;margin:0 .02em;vertical-align:.12em}
.sub{font-size:11.5px;color:var(--muted);margin:6px 0 10px}.sub b{color:var(--text)}
.leg{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}
.bdg{display:inline-block;font-size:8.5px;letter-spacing:.12em;font-weight:700;padding:1px 6px;border-radius:4px;border:1px solid currentColor;white-space:nowrap;vertical-align:middle}
.src-acs{color:#7ec8ff}.src-nhanes{color:#8dff9e}.src-pew{color:#ff9bd6}.src-nsfg{color:#ffd35c}
.cap{display:flex;align-items:center;gap:7px;margin:8px 0 4px;min-height:38px}
.cap .rk{font-family:'Bebas Neue',sans-serif;font-size:24px;line-height:1;width:26px;flex-shrink:0;color:var(--muted)}
.cap .tx{flex:1;min-width:0;font-size:12px;line-height:1.3}
.cap .tx small{display:block;font-size:9.5px;color:var(--muted)}
.cap .ed{flex-shrink:0;min-height:36px;padding:0 13px;border-radius:999px;border:1.5px solid var(--lime);color:var(--lime);font-size:10px;font-weight:700;letter-spacing:.12em}
.cham{position:relative;height:96px}
.cham svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.cham .dot{position:absolute;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;animation:pour .9s cubic-bezier(.5,0,.75,1.2) both}
@keyframes pour{0%{transform:translateY(-110px);opacity:0}25%{opacity:1}100%{transform:none;opacity:1}}
.cham .cnt{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:'Bebas Neue',sans-serif;font-size:34px;line-height:1;padding:3px 10px 1px;border-radius:8px;background:rgba(12,15,46,.82);color:#fff;white-space:nowrap;z-index:2}
.stream{position:relative;height:18px}
.stream i{position:absolute;left:50%;top:0;width:6px;height:6px;margin-left:-3px;border-radius:50%;animation:drip 1.1s linear infinite}
@keyframes drip{0%{transform:translateY(-4px);opacity:0}20%{opacity:1}100%{transform:translateY(18px);opacity:0}}
.nocut{display:flex;gap:7px;align-items:center;margin:2px 0;font-size:10.5px;color:var(--muted)}
.nocut .rk{font-family:'Bebas Neue',sans-serif;font-size:19px;width:26px;color:#4b5190}
.nocut i{flex:1;border-top:1px dashed #333a78}
.pile{position:relative;height:70px;margin:2px 0 0}
.pile .dot{position:absolute;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;animation:pour 1.1s cubic-bezier(.5,0,.75,1.2) both}
.spout{text-align:center;margin-top:4px;position:relative;z-index:2}
.spout .big{display:inline-block;font-family:'Bebas Neue',sans-serif;font-size:92px;line-height:.9;color:var(--lime);padding:4px 14px 0;text-shadow:0 0 22px rgba(200,241,53,.6)}
.spout p{font-size:12px;margin-top:6px}
.replay{display:block;margin:10px auto 0;min-height:40px;padding:0 16px;border-radius:999px;font-size:10.5px;letter-spacing:.12em;color:#0c0f2e;background:#7ec8ff;font-weight:700}
.src{font-size:9.5px;color:#8a90c2;line-height:1.45;margin:14px 0 8px}.src b{color:#d6d9ff}
.bottom{position:sticky;bottom:0;margin:0 -20px;padding:10px 20px 8px;background:linear-gradient(to top,var(--bg) 75%,transparent);display:flex;flex-direction:column;gap:2px;z-index:5}
.next{width:100%;padding:17px;font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:.12em;color:#0c0f2e;background:var(--lime);border-radius:999px}
.back{min-height:44px;display:flex;align-items:center;justify-content:center;font-size:12px;letter-spacing:.08em;color:var(--muted)}
.mock{position:fixed;right:6px;bottom:2px;font-size:8.5px;letter-spacing:.12em;color:#3e4483;text-transform:uppercase;pointer-events:none;z-index:6}
.pe-sheet{position:fixed;inset:0;z-index:50}.pe-back{position:absolute;inset:0;background:rgba(5,6,20,.7)}
.pe-panel{position:absolute;left:0;right:0;bottom:0;max-width:430px;margin:0 auto;background:#151a45;border-radius:22px 22px 0 0;padding:16px 20px 18px;transform:translateY(100%);transition:transform .25s;border-top:3px solid transparent;border-image:linear-gradient(90deg,#ff5fa2,#ffd35c,#c8f135,#5fe0ff,#a77bff) 1}
.pe-sheet.show .pe-panel{transform:none}
.pe-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.pe-k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.pe-badge{font-size:8.5px;letter-spacing:.12em;font-weight:700;padding:1px 6px;border-radius:4px;border:1px solid currentColor;margin-left:4px}
.pe-x{min-height:44px;color:var(--lime);font-size:11px;letter-spacing:.12em}
.pe-opts{display:flex;flex-direction:column;gap:7px}
.pe-opt{min-height:46px;display:flex;justify-content:space-between;align-items:center;padding:0 14px;border-radius:12px;border:1px solid #333a78;text-align:left;font-size:13px}
.pe-opt b{color:var(--lime)}.pe-opt.on{border-color:var(--lime);background:rgba(200,241,53,.12)}
.pe-note{font-size:10px;color:var(--muted);margin:10px 0}
.pe-done{width:100%;min-height:46px;border-radius:999px;background:var(--lime);color:#0c0f2e;font-weight:700;letter-spacing:.1em;font-size:12px;text-transform:uppercase}
</style></head>
<body><!-- SANDBOX MOCKUP V2C (dots pour). Amanda's real preferences x public data; counts estimated. No location shown. -->
<div id="app">
  <div class="prog"><i class="d"></i><i class="d"></i><i class="d"></i><i class="a"></i><i></i><i></i></div>
  <div class="appl">Applying as: <b>Single</b> · <u>Edit</u></div>
  <div><span class="lbl">YOUR REAL PREFERENCES · COUNTS ESTIMATED</span></div>
  <h1>YOUR P<span class="d" style="background:#ff5fa2"></span><span class="d" style="background:#5fe0ff"></span>L</h1>
  <p class="sub">Pour in <b id="startN"></b> single men. Each pick, in your ranked order, lets fewer dots through.</p>
  <div class="leg"><span class="bdg src-acs">CENSUS</span><span class="bdg src-nhanes">CDC</span><span class="bdg src-pew">EST</span><span class="bdg src-nsfg">EST</span></div>
  <div id="funnel"></div>
  <div class="pile" id="pile"></div>
  <div class="spout"><div class="big" id="big"></div><p>single men match everything you picked</p><button class="replay" type="button" id="replay">↻ POUR AGAIN</button></div>
  <p class="src" id="src"></p>
  <div class="bottom"><button class="next" type="button">NEXT</button><a class="back" href="all-cards_grokbot.html#sec-pool" target="_top">&larr; BACK</a></div>
</div>
<div class="mock">HTML mockup · V2C dots pour</div>
<script src="your-pool-real-data_grokbot.js"></script>
<script src="your-pool-engine_grokbot.js"></script>
<script>
const E=PoolEngine, $=s=>document.querySelector(s);
const PAL=['#ff5fa2','#ff8a3d','#ffd35c','#c8f135','#5fe0ff','#a77bff','#ffffff'];
const STROKE=['#ff5fa2','#ff8a3d','#ffd35c','#c8f135','#5fe0ff','#a77bff'];
let seed=7; const rnd=()=>{seed=(seed*16807)%2147483647; return seed/2147483647};
function dots(n,start,top,bot,delay0){
  const f=Math.max(0,Math.log(n/40)/Math.log(start/40)); const k=Math.round(5+60*f); let h='';
  for(let i=0;i<k;i++){const y=10+rnd()*80; const wy=top+(bot-top)*y/100; const x=50+(rnd()-.5)*(wy-8);
    h+=`<span class="dot" style="left:${x}%;top:${y}%;background:${PAL[Math.floor(rnd()*PAL.length)]};animation-delay:${(delay0+rnd()*.6).toFixed(2)}s"></span>`;}
  return h;
}
function chamber(top,bot,n,start,color,d0){
  const a=(100-top)/2,b=(100-bot)/2;
  return `<div class="cham"><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><polygon points="${a},0 ${100-a},0 ${100-b},100 ${b},100" fill="${color}14" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke" style="filter:drop-shadow(0 0 6px ${color})"/></svg>${dots(n,start,top,bot,d0)}<span class="cnt">${E.fmt(n)}</span></div>`;
}
const stream=c=>`<div class="stream"><i style="background:${c}"></i><i style="background:${c};animation-delay:.37s"></i><i style="background:${c};animation-delay:.74s"></i></div>`;
function render(){
  seed=7; const {start,steps,final}=E.compute(); let h='', prevW=100, ci=0, d0=0;
  h+=`<div class="cap"><span class="rk">IN</span><span class="tx">${E.seekL()}: ${E.startSub()} <span class="bdg src-acs">CENSUS</span><small>Seeking · City &amp; distance</small></span></div>`+chamber(100,94,start,start,STROKE[0],0);
  prevW=94; ci=1;
  steps.forEach(s=>{const r=s.r;
    if(r.fixed==='start') return;
    if(r.fixed==='nocut'){h+=`<div class="nocut">${r.label()} · no cut<i></i></div>`;return}
    const w=Math.min(prevW-5,E.width(s.n,start,26)), c=STROKE[ci%STROKE.length]; d0+=.25;
    h+=stream(c)+`<div class="cap"><span class="tx">${r.label()} <span class="bdg src-${r.src}">${E.SRC[r.src]}</span><small>keeps ${Math.round(s.keep*100)}% · ${Math.round((1-s.keep)*100)}% filtered out</small></span><button class="ed" type="button" data-k="${r.k}">EDIT</button></div>`+chamber(prevW,w,s.n,start,c,d0);
    prevW=w; ci++;
  });
  $('#funnel').innerHTML=h+stream('#c8f135');
  let p=''; const k=Math.round(8+28*Math.max(0,Math.log(final/40)/Math.log(start/40)));
  for(let i=0;i<k;i++){const y=20+rnd()*75, x=50+(rnd()-.5)*(10+y*.7); p+=`<span class="dot" style="left:${x}%;top:${y}%;background:${PAL[Math.floor(rnd()*PAL.length)]};animation-delay:${(d0+.3+rnd()*.7).toFixed(2)}s"></span>`;}
  $('#pile').innerHTML=p;
  $('#big').textContent='≈'+E.fmt(final); $('#startN').textContent=E.fmt(start);
  document.querySelectorAll('.ed').forEach(b=>b.onclick=()=>E.openEdit(b.dataset.k,render));
}
$('#replay').onclick=render;
$('#src').innerHTML=E.SOURCES; render();
</script>
</body></html>
