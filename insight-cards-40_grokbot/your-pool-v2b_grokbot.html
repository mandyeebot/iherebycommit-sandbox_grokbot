<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Your pool · V2B Candy pop · sandbox mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b1b3d;--bg:#fff3e3;--lime:#c8f135;--pink:#ff4f9a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:'Space Mono',monospace;font-size:14px;line-height:1.45}
body{background-color:var(--bg);background-image:radial-gradient(#ffb3d1 2px,transparent 2.5px),radial-gradient(#9be7ff 2px,transparent 2.5px),radial-gradient(#ffe14d 2px,transparent 2.5px);background-size:46px 46px,58px 58px,70px 70px;background-position:0 0,20px 30px,40px 10px;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
#app{max-width:430px;margin:0 auto;padding:0 20px;min-height:100vh;display:flex;flex-direction:column}
.prog{display:flex;gap:5px;padding:18px 0 0}.prog i{flex:1;height:6px;border-radius:9px;background:#f1dcc6}.prog i.d{background:var(--pink)}.prog i.a{background:var(--ink)}
.appl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:10px 0 0;color:#6d5a7d}.appl b{color:var(--pink)}
.lbl{display:inline-block;margin:14px 0 6px;padding:4px 10px;border-radius:999px;font-size:9.5px;letter-spacing:.12em;font-weight:700;background:var(--lime);border:2px solid var(--ink);box-shadow:2px 3px 0 var(--ink);transform:rotate(-1.5deg)}
h1{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:66px;line-height:.9;color:#fff;-webkit-text-stroke:2.5px var(--ink);text-shadow:4px 5px 0 var(--pink)}
h1 span{color:var(--lime);text-shadow:4px 5px 0 #7a5cff}
.sub{font-size:11.5px;margin:8px 0 12px;color:#4d3b5e}.sub b{background:#ffe14d;padding:0 4px;border-radius:4px}
.stk{display:inline-block;font-size:8.5px;letter-spacing:.1em;font-weight:700;padding:2px 7px;border-radius:999px;background:#fff;border:2px solid var(--ink);box-shadow:1px 2px 0 var(--ink);white-space:nowrap;vertical-align:middle;transform:rotate(-4deg)}
.stk:nth-child(even){transform:rotate(3deg)}
.src-acs{color:#1f6fd1}.src-nhanes{color:#1d9a3c}.src-pew{color:#d1137a}.src-nsfg{color:#b86b00}
.leg{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.rim{height:26px;margin:0 2px -10px;border-radius:50%;background:#fff;border:3px solid var(--ink);position:relative;z-index:2;box-shadow:inset 0 -6px 0 #ffd1e5}
.cap{display:flex;align-items:center;gap:8px;margin:14px 0 6px;min-height:40px}
.cap .rk{width:30px;height:30px;flex-shrink:0;border-radius:50%;background:#fff;border:2.5px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:17px;box-shadow:1px 2px 0 var(--ink)}
.cap .tx{flex:1;min-width:0;font-size:12px;line-height:1.3;font-weight:700}
.cap .tx small{display:block;font-size:9.5px;font-weight:400;color:#6d5a7d}
.cap .ed{flex-shrink:0;min-height:38px;padding:0 13px;border-radius:999px;background:#ffe14d;border:2.5px solid var(--ink);box-shadow:2px 3px 0 var(--ink);font-size:10px;font-weight:700;letter-spacing:.1em}
.cap .ed:active{transform:translate(2px,3px);box-shadow:none}
.blob{margin:0 auto;height:64px;border-radius:26px;border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.blob::after{content:'';position:absolute;left:12%;top:8px;width:30%;height:9px;border-radius:9px;background:rgba(255,255,255,.55)}
.blob .cnt{font-family:'Bebas Neue',sans-serif;font-size:38px;line-height:1;position:relative;z-index:1}
.nocut{display:flex;gap:8px;align-items:center;margin:12px 0 0;font-size:10.5px;color:#6d5a7d}
.nocut .rk{width:30px;text-align:center;font-family:'Bebas Neue',sans-serif;font-size:17px;color:#b9a6c6}
.nocut i{flex:1;border-top:2px dotted #d8c3e4}
.neck{width:70px;height:46px;margin:14px auto 0;background:#ff9bc6;border:3px solid var(--ink);border-top:none;border-radius:0 0 20px 20px;position:relative}
.drips{position:relative;height:30px}
.drips i{position:absolute;left:50%;width:12px;height:16px;margin-left:-6px;background:var(--pink);border:2px solid var(--ink);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;animation:fall 1.4s ease-in infinite}
.drips i:nth-child(2){animation-delay:.7s}
@keyframes fall{0%{top:-6px;opacity:0}20%{opacity:1}100%{top:22px;opacity:0}}
.heart{position:relative;width:250px;height:226px;margin:0 auto}
.heart svg{position:absolute;inset:0;filter:drop-shadow(5px 7px 0 var(--ink))}
.heart .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:30px;color:#fff;text-align:center}
.heart .big{font-family:'Bebas Neue',sans-serif;font-size:74px;line-height:.9;-webkit-text-stroke:2px var(--ink);text-shadow:3px 4px 0 var(--ink)}
.heart p{font-size:10.5px;font-weight:700;max-width:150px;line-height:1.25;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:8px;padding:2px 6px;margin-top:4px}
.src{font-size:9.5px;color:#5d4b6d;line-height:1.45;margin:16px 0 8px;background:rgba(255,255,255,.75);border:2px dashed #e0c9ee;border-radius:12px;padding:10px}
.bottom{position:sticky;bottom:0;margin:0 -20px;padding:10px 20px 8px;background:linear-gradient(to top,var(--bg) 75%,rgba(255,243,227,0));display:flex;flex-direction:column;gap:2px}
.next{width:100%;padding:16px;font-family:'Bebas Neue',sans-serif;font-size:25px;letter-spacing:.12em;background:var(--lime);border:3px solid var(--ink);border-radius:16px;box-shadow:0 6px 0 var(--ink)}
.back{min-height:44px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;letter-spacing:.08em}
.mock{position:fixed;right:6px;bottom:2px;font-size:8.5px;letter-spacing:.12em;color:#b9a6c6;text-transform:uppercase;pointer-events:none;z-index:2}
.pe-sheet{position:fixed;inset:0;z-index:50}.pe-back{position:absolute;inset:0;background:rgba(43,27,61,.45)}
.pe-panel{position:absolute;left:0;right:0;bottom:0;max-width:430px;margin:0 auto;background:#fff;border:3px solid var(--ink);border-bottom:none;border-radius:26px 26px 0 0;padding:16px 20px 18px;transform:translateY(100%);transition:transform .25s cubic-bezier(.3,1.4,.6,1)}
.pe-sheet.show .pe-panel{transform:none}
.pe-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.pe-k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.pe-badge{font-size:8.5px;letter-spacing:.1em;font-weight:700;padding:1px 6px;border-radius:999px;border:2px solid var(--ink);background:#fff;margin-left:4px}
.pe-x{min-height:44px;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--pink)}
.pe-opts{display:flex;flex-direction:column;gap:8px}
.pe-opt{min-height:46px;display:flex;justify-content:space-between;align-items:center;padding:0 14px;border-radius:14px;border:2.5px solid var(--ink);background:#fff8f0;font-size:13px;text-align:left}
.pe-opt.on{background:#ffd1e5;box-shadow:2px 3px 0 var(--ink)}
.pe-note{font-size:10px;color:#6d5a7d;margin:10px 0}
.pe-done{width:100%;min-height:48px;border-radius:14px;background:var(--lime);border:2.5px solid var(--ink);box-shadow:0 4px 0 var(--ink);font-weight:700;letter-spacing:.1em;font-size:12px;text-transform:uppercase}
</style></head>
<body><!-- SANDBOX MOCKUP V2B (candy pop funnel). Amanda's real preferences x public data; counts estimated. No location shown. -->
<div id="app">
  <div class="prog"><i class="d"></i><i class="d"></i><i class="d"></i><i class="a"></i><i></i><i></i></div>
  <div class="appl">Applying as: <b>Single</b> · <u>Edit</u></div>
  <div><span class="lbl">YOUR REAL PREFERENCES · COUNTS ESTIMATED</span></div>
  <h1>YOUR <span>POOL</span></h1>
  <p class="sub">Pour in <b id="startN"></b> single men. Each pick, in your ranked order, squeezes the funnel.</p>
  <div class="leg"><span class="stk src-acs">CENSUS</span><span class="stk src-nhanes">CDC</span><span class="stk src-pew">EST</span><span class="stk src-nsfg">EST</span></div>
  <div id="funnel"></div>
  <div class="neck"></div>
  <div class="drips"><i></i><i></i></div>
  <div class="heart"><svg viewBox="0 0 250 226" aria-hidden="true"><path d="M125 218 C 60 170 8 130 8 74 C 8 36 38 10 72 10 C 96 10 114 22 125 42 C 136 22 154 10 178 10 C 212 10 242 36 242 74 C 242 130 190 170 125 218 Z" fill="#ff4f9a" stroke="#2b1b3d" stroke-width="5"/><ellipse cx="54" cy="44" rx="15" ry="7" fill="#fff" opacity=".55" transform="rotate(-30 54 44)"/></svg>
    <div class="in"><div class="big" id="big"></div><p>single men match everything you picked</p></div></div>
  <p class="src" id="src"></p>
  <div class="bottom"><button class="next" type="button">NEXT</button><a class="back" href="all-cards_grokbot.html#sec-pool" target="_top">&larr; BACK</a></div>
</div>
<div class="mock">HTML mockup · V2B candy pop</div>
<script src="your-pool-real-data_grokbot.js"></script>
<script src="your-pool-engine_grokbot.js"></script>
<script>
const E=PoolEngine, $=s=>document.querySelector(s);
// header: AMANDA’S POOL from the signup's first name (YOUR POOL if none)
const _nm=(E.poss()||'Your').toUpperCase(); document.title=document.title.replace(/^Your pool/i,E.poolTitle());
function fitH1(){const h=document.querySelector('h1'); if(h){h.style.whiteSpace='nowrap'; E.fitFont(h,h.parentElement.clientWidth-parseFloat(getComputedStyle(h.parentElement).paddingLeft)-parseFloat(getComputedStyle(h.parentElement).paddingRight),30);}}
addEventListener('resize',fitH1); document.fonts&&document.fonts.ready.then(fitH1);
document.querySelector('h1').innerHTML=_nm+' <span>POOL</span>'; fitH1();
const CANDY=['#ff8fc2','#ffb347','#ffe14d','#c8f135','#6fe3ff','#b48bff'];
function render(){
  const {start,steps,final}=E.compute(); let h='', prevW=100, ci=0;
  h+=`<div class="cap"><span class="rk">★</span><span class="tx">${E.seekL()}: ${E.startSub()} <span class="stk src-acs">CENSUS</span><small>Seeking · City &amp; distance</small></span></div>
      <div class="rim"></div><div class="blob" style="width:100%;background:${CANDY[0]}"><span class="cnt">${E.fmt(start)}</span></div>`;
  ci=1;
  steps.forEach(s=>{const r=s.r;
    if(r.fixed==='start') return;
    if(r.fixed==='nocut'){h+=`<div class="nocut">${r.label()} · no cut<i></i></div>`;return}
    const w=Math.min(prevW-5,E.width(s.n,start,34));
    h+=`<div class="cap"><span class="tx">${r.label()} <span class="stk src-${r.src}">${E.SRC[r.src]}</span><small>keeps ${Math.round(s.keep*100)}%</small></span><button class="ed" type="button" data-k="${r.k}">EDIT</button></div>
        <div class="blob" style="width:${w}%;background:${CANDY[ci%CANDY.length]}"><span class="cnt">${E.fmt(s.n)}</span></div>`;
    prevW=w; ci++;
  });
  $('#funnel').innerHTML=h; $('#big').textContent='≈'+E.fmt(final); $('#startN').textContent=E.fmt(start);
  document.querySelectorAll('.ed').forEach(b=>b.onclick=()=>E.openEdit(b.dataset.k,render));
}
$('#src').innerHTML=E.SOURCES; render();
</script>
</body></html>
