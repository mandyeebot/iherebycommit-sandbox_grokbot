<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hot or Bot restyle mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bungee&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Static mockup, Oct 31 2026. Copy = real copy captured from swipe-prototype-nc50 (rating, check-in, results, Job & education detail).
   BLUE: no blue exists in the IHereByCommit palette (paper #F4EFE2, ink #141413, lime #C8F135, mint #6FD3BC, pale mint #DFF4EE, vermillion #E03C2E, orange #FF7A2F, secondary #5A564C).
   #2D5BFF is a PLACEHOLDER; override with ?blue=RRGGBB. GEH = Green Eggs teal #3BA7A5 + deep teal #2b8583 from seuss-lab_grokbot.html. */
*{box-sizing:border-box}html,body{margin:0}
body{--ink:#141413;--paper:#F4EFE2;--lime:#C8F135;--mint:#6FD3BC;--mp:#DFF4EE;--or:#FF7A2F;--blue:#2D5BFF;background:#d9d5ca;font-family:'Space Mono',monospace;color:var(--ink);-webkit-text-fill-color:currentColor;-webkit-text-size-adjust:100%}
button,a{appearance:none;-webkit-appearance:none;color:inherit;-webkit-text-fill-color:currentColor;text-decoration:none;font:inherit;border:0;background:none;padding:0;border-radius:0}
.wrap{display:flex;flex-wrap:wrap;gap:24px;padding:24px;justify-content:center}
.row{width:100%;font:700 12px 'Space Mono';letter-spacing:.14em;text-transform:uppercase;text-align:center;color:#141413}
.col{display:flex;flex-direction:column;gap:6px;align-items:center}.cap{font:700 10px 'Space Mono';letter-spacing:.12em;text-transform:uppercase;color:#141413}
.ph{width:393px;height:694px;overflow:hidden;position:relative;display:flex;flex-direction:column;padding:12px 16px 14px;background:var(--fld);color:var(--ink)}
body.one{background:var(--fld0)}body.one .wrap{padding:0;gap:0}body.one .cap,body.one .row{display:none}body.one .ph{width:100vw;height:100vh;height:100dvh}
/* ---------- shared bits ---------- */
.top{display:flex;justify-content:space-between;align-items:center;flex:none}
.logo{font:400 30px/1 'Bebas Neue';letter-spacing:.01em;display:flex;align-items:baseline;gap:4px}
.logo .or{font:700 12px 'Space Mono';text-transform:lowercase;padding:0 2px}
.cnt{font:700 10px 'Space Mono';letter-spacing:.14em;text-transform:uppercase;padding:3px 6px}
.card{position:relative;flex:1;min-height:0;margin-top:10px;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;overflow:hidden}
.photo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 10px 'Space Mono';letter-spacing:.14em}
.nm{position:relative;font:400 44px/1 'Bebas Neue'}.sub{position:relative;font:700 10px 'Space Mono';letter-spacing:.16em;text-transform:uppercase;margin-top:4px}
.rate{display:grid;grid-template-columns:repeat(9,1fr);gap:5px;margin-top:12px;flex:none}
.rate button{height:46px;font:400 26px/46px 'Bebas Neue';text-align:center}
.heat{height:6px;margin-top:6px;flex:none}
.ends{display:flex;justify-content:space-between;font:700 9.5px 'Space Mono';letter-spacing:.12em;text-transform:uppercase;margin-top:6px;flex:none}
.eb{display:flex;gap:8px;align-items:center;flex:none}.eb b{font:700 10px 'Space Mono';letter-spacing:.14em;text-transform:uppercase;padding:4px 8px}.eb span{font:700 9.5px 'Space Mono';letter-spacing:.12em;text-transform:uppercase}
.ic{flex:1;min-height:0;margin-top:10px;padding:16px;display:flex;flex-direction:column;overflow:hidden}
.k{font:700 10px 'Space Mono';letter-spacing:.14em;text-transform:uppercase}
.big{font:400 92px/.85 'Bebas Neue';margin-top:8px}.big small{font-size:36px;margin-left:6px}
.h{font:400 32px/1 'Bebas Neue';margin-top:8px}
.p{font:12.5px/1.5 'Space Mono';margin:8px 0 0}
.bars{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:110px 1fr 34px;align-items:center;gap:8px;font:700 11px 'Space Mono'}
.bar i{display:block;height:18px}
.sd{margin-top:auto;font:700 11px 'Space Mono';letter-spacing:.12em;text-transform:uppercase;padding-top:10px}
.foot{display:flex;justify-content:space-between;align-items:center;font:10px 'Space Mono';padding-top:8px;margin-top:8px}
.foot b{font:400 15px 'Bebas Neue';letter-spacing:.02em}
.dots{display:flex;gap:5px;justify-content:center;margin-top:10px;flex:none}.dots i{width:7px;height:7px}.dots i.on{width:22px}
.hint{font:10px 'Space Mono';text-align:center;margin-top:5px;flex:none}
.cta{flex:none;width:100%;margin-top:10px;height:54px;font:400 28px/54px 'Bebas Neue';letter-spacing:.04em;text-align:center}
.sheetbd{position:absolute;inset:0}
.sheet{position:absolute;left:0;right:0;bottom:0;top:62px;padding:16px 18px 14px;display:flex;flex-direction:column}
.sheet .h{margin-top:0}.sheet h4{font:700 10px 'Space Mono';letter-spacing:.14em;text-transform:uppercase;margin:12px 0 6px}
.sheet .p{font-size:11.5px;line-height:1.45;margin-top:5px}
.ph.sheetbase>*:not(.sheetbd):not(.sheet){filter:none}
.nod{position:absolute;right:10px;bottom:4px;font:700 8px 'Space Mono';letter-spacing:.1em;opacity:.7}

/* ---------- STYLE A: BOLD BLUE ---------- */
.s-blue{--fld:var(--blue)}
.s-blue .logo{color:#fff}.s-blue .logo .hot{color:var(--lime)}.s-blue .logo .or{background:#fff;color:var(--ink);border:2px solid var(--ink)}.s-blue .logo .bot{color:#fff;-webkit-text-stroke:1.5px var(--ink);text-shadow:3px 3px 0 var(--ink)}
.s-blue .logo .hot{text-shadow:3px 3px 0 var(--ink)}
.s-blue .cnt{background:var(--ink);color:#fff}
.s-blue .card{border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);background:#f4efe2;margin-right:6px}
.s-blue .photo{background:repeating-linear-gradient(135deg,#e8e1d0 0 18px,#efe9da 18px 36px);color:#5A564C}
.s-blue .card::after{content:"";position:absolute;left:0;right:0;bottom:0;height:45%;background:linear-gradient(transparent,rgba(20,20,19,.75))}
.s-blue .nm,.s-blue .sub{color:#fff;z-index:1}
.s-blue .rate button{background:#fff;color:var(--ink);border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
.s-blue .rate button.sel{background:var(--lime);transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.s-blue .heat{background:linear-gradient(90deg,var(--mint),var(--lime),var(--or));border:2px solid var(--ink)}
.s-blue .ends{color:#fff}
.s-blue .eb b{background:var(--or);color:var(--ink);border:2px solid var(--ink)}.s-blue .eb span{color:#fff}
.s-blue .ic{background:var(--lime);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);margin-right:6px}
.s-blue .ic.cr{background:var(--paper)}
.s-blue .h span{background:var(--ink);color:var(--lime);padding:0 6px}
.s-blue .bar i{border:2px solid var(--ink)}.s-blue .bar i.a{background:var(--blue)}.s-blue .bar i.b{background:#fff}
.s-blue .sd{color:var(--blue)}
.s-blue .foot{border-top:2px solid var(--ink)}
.s-blue .dots i{background:rgba(255,255,255,.45)}.s-blue .dots i.on{background:var(--lime);border:1.5px solid var(--ink)}
.s-blue .hint{color:#fff}
.s-blue .cta{background:var(--ink);color:#fff;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--lime)}
.s-blue .sheetbd{background:rgba(20,20,19,.45)}
.s-blue .sheet{background:var(--paper);border-top:3px solid var(--ink)}
.s-blue .sheet .cta{box-shadow:none}

/* ---------- STYLE B: GREEN EGGS & HAM (seuss-lab "Loud Lab" minus the grid) ---------- */
.s-geh{--fld:#3BA7A5}
.s-geh .logo{font:400 26px/1 'Bungee';color:var(--paper);-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink)}
.s-geh .logo .hot{color:var(--lime)}.s-geh .logo .or{background:var(--ink);color:var(--lime);-webkit-text-stroke:0;text-shadow:none;border-radius:99px;padding:1px 6px}
.s-geh .cnt{background:var(--ink);color:var(--lime);border-radius:99px;padding:3px 9px}
.s-geh .card{border:3px solid var(--ink);border-radius:22px;box-shadow:5px 5px 0 var(--ink);margin-right:5px}
.s-geh .photo{background:radial-gradient(circle at 50% 42%,#DFF4EE 0 28%,#c9ebe1 29% 100%);color:#2b8583}
.s-geh .card::after{content:"";position:absolute;left:0;right:0;bottom:0;height:45%;background:linear-gradient(transparent,rgba(20,20,19,.7))}
.s-geh .nm{font:400 38px/1 'Bungee';color:var(--lime);-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;z-index:1}.s-geh .sub{color:#fff;z-index:1}
.s-geh .rate button{background:var(--paper);color:var(--ink);border:2.5px solid var(--ink);border-radius:50%;height:36px;font:400 17px/32px 'Bungee';box-shadow:2px 3px 0 var(--ink)}
.s-geh .rate{gap:4px}
.s-geh .rate button.sel{background:var(--lime);box-shadow:none;transform:translateY(3px)}
.s-geh .heat{background:repeating-linear-gradient(-45deg,var(--lime) 0 8px,#b4dc22 8px 16px);border:2px solid var(--ink);border-radius:99px;height:8px}
.s-geh .ends{color:var(--ink)}
.s-geh .eb b{background:var(--ink);color:var(--lime);border-radius:99px}.s-geh .eb span{color:var(--ink)}
.s-geh .ic{background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:5px 5px 0 var(--ink);margin-right:5px}
.s-geh .big{font:400 70px/.9 'Bungee';color:var(--lime);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink)}.s-geh .big small{font-size:24px;color:var(--ink);-webkit-text-stroke:0;text-shadow:none}
.s-geh .h{font:400 22px/1.1 'Bungee'}
.s-geh .h span{background:var(--lime);border:2px solid var(--ink);border-radius:40% 55% 45% 60%/60% 45% 55% 40%;padding:0 8px;display:inline-block;transform:rotate(-2deg)}
.s-geh .bar i{border:2px solid var(--ink);border-radius:99px}.s-geh .bar i.a{background:#3BA7A5}.s-geh .bar i.b{background:var(--lime)}
.s-geh .sd{color:#2b8583}
.s-geh .foot{border-top:2px dashed var(--ink)}.s-geh .foot b{font:400 11px 'Bungee'}
.s-geh .dots i{background:rgba(20,20,19,.3);border-radius:99px}.s-geh .dots i.on{background:var(--lime);border:1.5px solid var(--ink)}
.s-geh .hint{color:var(--ink)}
.s-geh .cta{background:var(--ink);color:var(--lime);border-radius:99px;font:400 20px/54px 'Bungee';box-shadow:4px 4px 0 var(--paper)}
.s-geh .sheetbd{background:rgba(20,20,19,.4)}
.s-geh .sheet{background:var(--paper);border:3px solid var(--ink);border-radius:26px 26px 0 0}
.s-geh .sheet .h{font-size:20px}

/* ---------- STYLE C: TEAL BOLD = Style A layout recoloured with Green Eggs and Ham colours.
   teal #3BA7A5 (Amanda's GEH teal, approx, from memory/seuss-lab); others SAMPLED (approx) from the 1960 first-edition cover image on Wikipedia
   (https://en.wikipedia.org/wiki/File:Green_Eggs_and_Ham.jpg): cover red-orange #FF4417, egg/ham green #84B46C, ham pink #D87860, paper white #FFF8F2, ink #000. */
.s-tb{--blue:#3BA7A5;--lime:#84B46C;--or:#FF4417;--mint:#D87860;--paper:#FFF8F2;--ink:#000}
.s-tb .logo .hot{color:#84B46C}.s-tb .logo .bot{color:#FFF8F2}.s-tb .logo .or{background:#FF4417;color:#000}
.s-tb .cnt{background:#000;color:#FFF8F2}
.s-tb .heat{background:linear-gradient(90deg,#84B46C,#D87860,#FF4417)}
.s-tb .rate button{background:#FFF8F2}.s-tb .rate button.sel{background:#84B46C}
.s-tb .ends,.s-tb .hint,.s-tb .eb span{color:#000}
.s-tb .ic{background:#84B46C}.s-tb .ic.cr{background:#FFF8F2}
.s-tb .h span{background:#000;color:#FFF8F2}
.s-tb .big small{color:#FF4417}
.s-tb .bar i.a{background:#FF4417}.s-tb .bar i.b{background:#D87860}
.s-tb .sd{color:#000;text-decoration:underline 2px #FF4417;text-underline-offset:3px}
.s-tb .dots i{background:rgba(0,0,0,.3)}.s-tb .dots i.on{background:#FF4417}
.s-tb .cta{background:#000;color:#FFF8F2;box-shadow:5px 5px 0 #D87860}
.s-tb .eb b{background:#FF4417;color:#000}
.s-tb .photo{background:repeating-linear-gradient(135deg,#e9f1e4 0 18px,#f4f7ef 18px 36px);color:#000}

/* ---------- STYLE D: TEAL LIME = tealbold with our lime #C8F135 replacing sampled green, plus yellow #FFD23F
   (yellow from the insight-card mockups, e.g. taste-equation / match-rate / cards40; not on the palette sheet) as a nod to Hot or Not's #ffcc33 rating box. */
.s-tl{--lime:#C8F135;--yel:#FFD23F}
.s-tl .logo .hot{color:#C8F135}
.s-tl .logo .bot{color:#FFD23F}
.s-tl .rate{background:#FFD23F;border:3px solid #000;box-shadow:5px 5px 0 #000;padding:7px;margin-right:5px}
.s-tl .rate button{box-shadow:2px 2px 0 #000;height:40px;line-height:40px}
.s-tl .rate button.sel{background:#C8F135}
.s-tl .heat{background:linear-gradient(90deg,#C8F135,#FFD23F,#D87860,#FF4417);margin-top:9px}
.s-tl .ic{background:#C8F135}.s-tl .ic.cr{background:#FFF8F2}
.s-tl .h span{background:#000;color:#C8F135}
.s-tl .ic.cr .h span{color:#FFD23F}
.s-tl .eb b{background:#FFD23F;color:#000;border:2px solid #000}
.s-tl .dots i.on{background:#C8F135;border:1.5px solid #000}
.s-tl .sheet .h span{background:#FFD23F;color:#000;border:2px solid #000}
.s-tl .bar i.b{background:#FFD23F}
.s-tl .cnt{background:#000;color:#FFD23F}

/* ---------- STYLE E: TEAL LIME 2 = teallime with every yellow swapped for our lime #C8F135 (Amanda: no yellow). Lime-on-lime kept apart with black outlines/shadows. */
.s-tl2 .logo .bot{color:#C8F135;-webkit-text-stroke:1.5px #000}
.s-tl2 .cnt{color:#C8F135}
.s-tl2 .rate{background:#C8F135}
.s-tl2 .rate button{background:#FFF8F2}.s-tl2 .rate button.sel{background:#000;color:#C8F135;-webkit-text-fill-color:#C8F135}
.s-tl2 .heat{background:linear-gradient(90deg,#C8F135,#D87860,#FF4417)}
.s-tl2 .eb b{background:#C8F135}
.s-tl2 .ic.cr .h span{color:#C8F135}
.s-tl2 .sheet .h span{background:#C8F135}
.s-tl2 .bar i.b{background:#C8F135}
.s-tl2 .ic .bar i.y{background:#000}.s-tl2 .ic .bar i.m{background:#FF4417}
.s-tl2 .ic .tr{display:block;height:16px;background:#FFF8F2;border:2px solid #000;position:relative}.s-tl2 .ic .tr i{position:absolute;left:0;top:0;bottom:0;border:0}
.s-tl2 .ic .p.sm{font-size:11px;opacity:.75}

/* ---------- STYLE F: TEAL LIME 3 = teallime2 with red-orange #FF4417 swapped for our orange #FF7A2F (Amanda). */
.s-tl3{--or:#FF7A2F}
.s-tl3 .logo .or{background:#FF7A2F;color:#000}
.s-tl3 .big small{color:#FF7A2F}
.s-tl3 .bar i.a{background:#FF7A2F}
.s-tl3 .sd{color:#000;text-decoration:underline 2px #FF7A2F;text-underline-offset:3px}
.s-tl3 .eb b{background:#FF7A2F;color:#000}
.s-tl3 .heat{background:linear-gradient(90deg,#C8F135,#D87860,#FF7A2F)}
.s-tl3 .ic .bar i.m{background:#FF7A2F}
.s-tl3 .eb b{background:#C8F135;color:#000}
.s-tl3 .ic:not(.cr) .big small{color:#000;-webkit-text-fill-color:#000;text-decoration:underline 5px #FF7A2F;text-underline-offset:4px}
</style></head><body>
<div class="wrap" id="w"></div>
<script>
var Q=new URLSearchParams(location.search),B=(Q.get('blue')||'').replace(/[^0-9a-f]/gi,'');
if(B.length==6)document.body.style.setProperty('--blue','#'+B);
var LOGO='<div class="logo"><span class="hot">HOT</span><span class="or">or</span><span class="bot">BOT</span></div>';
var RATE=function(sel){var s='';for(var i=1;i<=9;i++)s+='<button class="'+(i==sel?'sel':'')+'" aria-label="Rate '+i+'">'+i+'</button>';return '<div class="rate">'+s+'</div><div class="heat"></div><div class="ends"><span>1 = Not for me</span><span>9 = Very into them</span></div>'};
var S=[
['Rating card',function(){return '<div class="top">'+LOGO+'<div class="cnt">Round 1 · Card 1 / 25</div></div><div class="card"><div class="photo">VIDEO CLIP</div><div class="nm">E.</div><div class="sub">Face only · Round 1</div></div>'+RATE(7)}],
['Check-in',function(){return '<div class="eb"><b>Early read</b><span>10 cards · prototype estimate</span></div><div class="ic"><div class="k">Round 1 · 10 of 25</div><div class="big">10<small>RATED</small></div><div class="h"><span>Early read</span></div><p class="p">A first look at how you rate. <b>Not your type</b> — 10 ratings is far too few for that.</p><div class="foot" style="margin-top:auto"><span>Source: your Hot or Bot ratings · 10 ratings</span><b>IHEREBYCOMMIT</b></div></div><div class="dots"><i class="on"></i><i></i><i></i><i></i></div><div class="hint">Tap or swipe for the next card · 4 cards</div><button class="cta">Keep rating</button>'}],
['Final results',function(){return '<div class="eb"><b>Your results</b><span>prototype estimate</span></div><div class="ic cr"><div class="k">Job &amp; education · can\'t tell yet</div><div class="big">+1.1<small>PTS</small></div><div class="h"><span>A doctor or a barista?</span> Same score from you</div><p class="p">The job title barely moved your ratings. The likely range includes zero.</p><div class="bars"><div class="bar"><span>Professional (9)</span><i class="a" style="width:70%"></i><span>6.3</span></div><div class="bar"><span>Service (16)</span><i class="b" style="width:59%"></i><span>5.3</span></div></div><div class="sd">See details ›</div><div class="foot"><span>Source: your Hot or Bot ratings · 25 ratings</span><b>IHEREBYCOMMIT</b></div></div><div class="dots"><i></i><i></i><i class="on"></i><i></i><i></i><i></i></div><div class="hint">Tap or swipe for the next card · 6 cards</div><button class="cta">Next: import your app data</button>'}],
['Detail sheet',function(){return '<div class="eb"><b>Your results</b><span>prototype estimate</span></div><div class="sheetbd"></div><div class="sheet"><div class="h"><span>Job &amp; education</span></div><p class="p">A doctor and a barista with the same face got about the same score from you.</p><h4>Your round-2 average</h4><div class="bars" style="margin-top:0"><div class="bar"><span>Professional (10)</span><i class="a" style="width:67%"></i><span>6.0</span></div><div class="bar"><span>Service (15)</span><i class="b" style="width:59%"></i><span>5.3</span></div></div><h4>Change from your face-only rating</h4><p class="p">Professional listings: +1.8 on average. Service listings: +0.1.</p><p class="p">Likely range: −1.6 to +4.9 points. That range includes zero, so we can\'t tell this apart from no effect at all.</p><h4>By listed degree</h4><div class="bars" style="margin-top:0;gap:5px"><div class="bar"><span>JD (2)</span><i class="a" style="width:83%"></i><span>7.5</span></div><div class="bar"><span>MS (3)</span><i class="b" style="width:70%"></i><span>6.3</span></div><div class="bar"><span>HS (11)</span><i class="b" style="width:66%"></i><span>5.9</span></div></div><button class="cta" style="margin-top:auto">DONE</button></div>'}]
];
var CHK2=['Check-in',function(){return '<div class="eb"><b>Early read</b><span>10 cards · prototype estimate</span></div><div class="ic"><div class="k">R1 · 10 rated · How choosy</div><div class="big">4.6<small>AVG</small></div><div class="h"><span>A bit pickier than most,</span> so far</div><p class="p">Most people would give these guys about <b>5.1</b> (our estimate).</p><p class="p sm">First look, not your type: 10 ratings is far too few.</p><div class="bars" style="margin-top:auto"><div class="bar"><span>You</span><span class="tr"><i class="y" style="width:51%"></i></span><span>4.6</span></div><div class="bar"><span>Most people (est.)</span><span class="tr"><i class="m" style="width:57%"></i></span><span>5.1</span></div></div><div class="sd">See details ›</div><div class="foot"><span>Source: your Hot or Bot ratings · 10 ratings</span><b>IHEREBYCOMMIT</b></div></div><div class="dots"><i class="on"></i><i></i><i></i></div><div class="hint">Tap or swipe for the next card · 3 cards</div><button class="cta">Keep rating</button>'}];
