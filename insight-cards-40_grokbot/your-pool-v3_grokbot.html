<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Your pool · V3 neon, brand palette, no-scroll · sandbox mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* PALETTE: #0e0e0e black · #f0ece0 off-white · #ffffff white · #c8f135 lime · #FF7A2F orange (+ their opacities/gradients only) */
:root{--k:#0e0e0e;--ow:#f0ece0;--w:#fff;--lime:#c8f135;--or:#FF7A2F;--muted:rgba(240,236,224,.62)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--k);color:var(--ow);font-family:'Space Mono',monospace;font-size:12px;line-height:1.35}
body{background:radial-gradient(90% 38% at 0% 0%,rgba(200,241,53,.13),transparent 70%),radial-gradient(90% 40% at 100% 78%,rgba(255,122,47,.16),transparent 70%),var(--k)}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.05;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .94 0 0 0 0 .925 0 0 0 0 .88 0 0 0 1 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
#app{position:relative;z-index:2;max-width:430px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:0 18px}
.prog{display:flex;gap:4px;padding:10px 0 0;flex-shrink:0}.prog i{flex:1;height:3px;background:rgba(240,236,224,.16)}.prog i.d{background:var(--lime)}.prog i.a{background:var(--ow)}
.hd{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0 0}
.appl{font-size:10px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}.appl b{color:var(--lime)}
.info{font-size:10px;color:var(--ow);border:1px solid rgba(240,236,224,.35);border-radius:999px;min-height:26px;padding:0 9px;white-space:nowrap}
.lbl{flex-shrink:0;align-self:flex-start;margin:6px 0 0;padding:2px 7px;border-radius:999px;font-size:10px;letter-spacing:.05em;font-weight:700;color:var(--k);background:linear-gradient(90deg,var(--lime),var(--or))}
.ttl{flex-shrink:0;display:flex;align-items:baseline;justify-content:space-between;margin:2px 0 4px}
h1{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:40px;line-height:1;letter-spacing:.5px;color:var(--ow)}
h1 span{color:var(--lime);text-shadow:0 0 14px rgba(200,241,53,.5)}
.ttl p{font-size:10px;color:var(--muted);text-align:right;line-height:1.3}
.main{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center}
#funnel{filter:drop-shadow(0 0 8px rgba(200,241,53,.28)) drop-shadow(0 0 14px rgba(255,122,47,.2))}
.band{position:relative;height:clamp(38px,6.4vh,48px);margin:0 auto 4px;display:flex;align-items:center;gap:6px;color:var(--k);cursor:pointer}
.band.start{cursor:default}
.band .rk{font-family:'Bebas Neue',sans-serif;font-size:17px;line-height:1;opacity:.55;width:17px;flex-shrink:0}
.band .lb{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.band .sp{flex:1}
.band .ct{font-family:'Bebas Neue',sans-serif;font-size:23px;line-height:1;white-space:nowrap}
.band .ed{flex-shrink:0;height:28px;padding:0 8px;border-radius:999px;background:var(--k);color:var(--lime);font-size:10px;font-weight:700;letter-spacing:.08em}
.bd{flex-shrink:0;display:inline-block;font-size:10px;line-height:1;font-weight:700;letter-spacing:.03em;padding:3px 5px 2px;border-radius:4px;white-space:nowrap;border:1.5px solid var(--k)}
.b-acs{background:var(--k);color:var(--lime)}
.b-nhanes{background:transparent;color:var(--k)}
.b-pew{background:var(--w);color:var(--k);border-color:var(--w)}
.b-nsfg{background:var(--k);color:var(--or)}
.nocut{font-size:10px;color:var(--muted);text-align:center;margin:2px 0 1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nocut b{color:var(--ow);font-weight:400}
.neck{height:16px;margin:2px auto 0;background:linear-gradient(180deg,var(--or),rgba(255,122,47,.25));clip-path:polygon(0 0,100% 0,64% 100%,36% 100%)}
.spout{text-align:center;margin-top:1px}
.spout .big{font-family:'Bebas Neue',sans-serif;font-size:62px;line-height:.88;color:var(--lime);text-shadow:0 0 14px rgba(200,241,53,.85),0 0 34px rgba(200,241,53,.45),0 0 60px rgba(255,122,47,.45)}
.spout p{font-size:10px;color:var(--ow);margin-top:2px}
.bottom{flex-shrink:0;padding:8px 0 4px;display:flex;flex-direction:column}
.next{width:100%;height:50px;font-family:'Bebas Neue',sans-serif;font-size:23px;letter-spacing:.12em;color:var(--k);background:var(--lime);border-radius:6px;box-shadow:0 0 18px rgba(200,241,53,.35)}
.back{height:34px;display:flex;align-items:center;justify-content:center;font-size:11px;letter-spacing:.08em;color:var(--muted)}
.mock{position:fixed;right:5px;bottom:1px;font-size:8px;letter-spacing:.1em;color:rgba(240,236,224,.22);text-transform:uppercase;pointer-events:none;z-index:3}
/* sheets */
.pe-sheet,.src-sheet{position:fixed;inset:0;z-index:50}
.pe-back,.src-back{position:absolute;inset:0;background:rgba(14,14,14,.72)}
.pe-panel,.src-panel{position:absolute;left:0;right:0;bottom:0;max-width:430px;margin:0 auto;background:#171714;border-top:2px solid var(--lime);border-radius:16px 16px 0 0;padding:12px 18px 14px;box-shadow:0 -10px 34px rgba(255,122,47,.25);transform:translateY(100%);transition:transform .22s}
.pe-sheet.show .pe-panel,.src-sheet.show .src-panel{transform:none}
.pe-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.pe-k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pe-badge{font-size:10px;font-weight:700;padding:2px 5px;border-radius:4px;margin-left:4px;border:1.5px solid var(--lime)}
.pe-badge.src-acs{background:var(--k);color:var(--lime)}.pe-badge.src-nhanes{color:var(--ow);border-color:var(--ow)}.pe-badge.src-pew{background:var(--w);color:var(--k);border-color:var(--w)}.pe-badge.src-nsfg{background:var(--k);color:var(--or);border-color:var(--or)}
.pe-x{min-height:40px;color:var(--lime);font-size:11px;letter-spacing:.12em}
.pe-opts{display:flex;flex-direction:column;gap:6px}
.pe-opt{min-height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 14px;border-radius:8px;border:1px solid rgba(240,236,224,.18);text-align:left;font-size:13px}
.pe-opt b{color:var(--lime)}.pe-opt.on{border-color:var(--lime);background:linear-gradient(90deg,rgba(200,241,53,.2),rgba(255,122,47,.16))}
.pe-note{font-size:10px;color:var(--muted);margin:8px 0}
.pe-done{width:100%;min-height:44px;border-radius:8px;background:var(--lime);color:var(--k);font-weight:700;letter-spacing:.1em;font-size:12px;text-transform:uppercase}
.src-panel{font-size:10px;line-height:1.45;color:rgba(240,236,224,.8)}.src-panel b{color:var(--ow)}
.src-leg{display:flex;flex-wrap:wrap;gap:6px 8px;margin:8px 0;padding:8px;border-radius:8px;background:var(--lime);color:var(--k);font-size:10px;align-items:center}
.src-leg span{display:inline-flex;gap:4px;align-items:center}
</style></head>
<body><!-- SANDBOX MOCKUP V3 (neon funnel, brand palette, no-scroll; condensed from V2A). Amanda's real preferences x public data; counts estimated. No location shown. -->
<div id="app">
  <div class="prog"><i class="d"></i><i class="d"></i><i class="d"></i><i class="a"></i><i></i><i></i></div>
  <div class="hd"><span class="appl">Applying as: <b>Single</b> · <u>Edit</u></span><button class="info" type="button" id="infoBtn">ⓘ Sources</button></div>
  <span class="lbl">YOUR REAL PREFERENCES · COUNTS ESTIMATED</span>
  <div class="ttl"><h1>YOUR <span>POOL</span></h1><p>your 10 picks,<br>in your ranked order</p></div>
  <div class="main">
    <div id="funnel"></div>
    <div class="nocut" id="nocut"></div>
    <div class="neck" id="neck"></div>
    <div class="spout"><div class="big" id="big"></div><p>single men match everything you picked</p></div>
  </div>
  <div class="bottom"><button class="next" type="button">NEXT</button><a class="back" href="all-cards_grokbot.html#sec-pool" target="_top">&larr; BACK</a></div>
</div>
<div class="mock">mockup · V3 brand palette</div>
<script src="your-pool-real-data_grokbot.js"></script>
<script src="your-pool-engine_grokbot.js"></script>
<script>
const E=PoolEngine, S=E.S, $=s=>document.querySelector(s);
const SHORT={intent:()=>({rel:'Relationship',looking:'Any dating',single:'Any single'})[S.intent],
  kids:()=>S.kids==='yes'?'Wants kids':'Kids: any',
  height:()=>'Height '+({'58':'5′8″+','510':'5′10″+','511':'5′11″+','60':'6′0″+','62':'6′2″+','any':'any'})[S.height],
  edu:()=>({any:'Any degree',ba:'Bachelor’s+',ma:'Master’s+'})[S.edu],
  inc:()=>'Income '+({'0':'any','50000':'$50k+','100000':'$100k+','150000':'$150k+','200000':'$200k+','300000':'$300k+'})[S.inc]};
const B={acs:'b-acs',nhanes:'b-nhanes',pew:'b-pew',nsfg:'b-nsfg'};
// lime -> orange mix (only brand hexes)
const L=[200,241,53], O=[255,122,47];
const mix=t=>`rgb(${L.map((v,i)=>Math.round(v+(O[i]-v)*t)).join(',')})`;
function trap(top,bot){const a=(100-top)/2,b=(100-bot)/2;return `polygon(${a}% 0,${100-a}% 0,${100-b}% 100%,${b}% 100%)`}
function render(){
  const {start,steps,final}=E.compute(); const cuts=steps.filter(s=>s.r.k);
  const W=n=>66+34*Math.max(0,Math.min(1,Math.log(n/40)/Math.log(start/40)));
  let h='', prev=100; const n=cuts.length;
  const pad=(top,bot)=>`padding:0 ${(100-Math.min(top,bot))/2*0.01*353+10}px`;
  h+=`<div class="band start" style="width:100%;clip-path:${trap(100,97)};background:linear-gradient(90deg,var(--ow),var(--lime));padding:0 12px"><span class="lb">03·04 Single men 31–54 · ≤30 mi</span><span class="bd b-acs">ACS</span><span class="sp"></span><span class="ct">${E.fmt(start)}</span></div>`;
  prev=97;
  cuts.forEach((s,i)=>{const r=s.r, w=Math.min(prev-3,W(s.n)), t=(i+1)/n;
    const inset=(100-w)/2; 
    h+=`<div class="band" data-k="${r.k}" role="button" aria-label="Edit ${r.name}" style="width:100%;clip-path:${trap(prev,w)};background:linear-gradient(90deg,${mix(Math.max(0,t-.2))},${mix(t)});padding:0 calc(${inset}% + 9px)"><span class="rk">${r.rk}</span><span class="lb">${SHORT[r.k]()}</span><span class="bd ${B[r.src]}">${E.SRC[r.src]}</span><span class="sp"></span><span class="ct">${E.fmt(s.n)}</span><button class="ed" type="button" data-k="${r.k}">EDIT</button></div>`;
    prev=w;
  });
  $('#funnel').innerHTML=h; $('#neck').style.width=(prev*0.8)+'%';
  $('#nocut').innerHTML='<b>07 Ethnicity · 09 Kids · 10 Religion</b>: any, no cut';
  $('#big').textContent='≈'+E.fmt(final);
  document.querySelectorAll('.band[data-k]').forEach(b=>b.onclick=()=>E.openEdit(b.dataset.k,render));
}
$('#infoBtn').onclick=()=>{const w=document.createElement('div'); w.className='src-sheet';
  w.innerHTML=`<div class="src-back"></div><div class="src-panel"><div class="pe-top"><span class="pe-k">Sources &amp; method</span><button class="pe-x" type="button">CLOSE</button></div>
  <div class="src-leg"><span><span class="bd b-acs">ACS</span>Census</span><span><span class="bd b-nhanes">NHANES</span>CDC height</span><span><span class="bd b-pew">PEW EST</span>intent</span><span><span class="bd b-nsfg">NSFG EST</span>wants kids</span></div>
  <p>${E.SOURCES}</p><p style="margin-top:6px">Each step keeps: ${E.compute().steps.filter(s=>s.r.k).map(s=>s.r.rk+' '+Math.round(s.keep*100)+'%').join(' · ')}.</p></div>`;
  const c=()=>w.remove(); document.body.appendChild(w); requestAnimationFrame(()=>w.classList.add('show'));
  w.querySelector('.src-back').onclick=w.querySelector('.pe-x').onclick=c;};
render();
</script>
</body></html>
