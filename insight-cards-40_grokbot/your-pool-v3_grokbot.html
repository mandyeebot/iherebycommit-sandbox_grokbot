<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Your pool · V3 neon, brand palette, no-scroll · sandbox mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* PALETTE: #0e0e0e black · #f0ece0 off-white · #ffffff white · #c8f135 lime · #FF7A2F orange (+ their opacities/gradients only) */
:root{--k:#0e0e0e;--ow:#f0ece0;--w:#fff;--lime:#c8f135;--or:#FF7A2F;--muted:rgba(240,236,224,.62)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--k);color:var(--ow);font-family:'Space Mono',monospace;font-size:12px;line-height:1.35}
body{background:radial-gradient(90% 38% at 0% 0%,rgba(200,241,53,.13),transparent 70%),radial-gradient(90% 40% at 100% 78%,rgba(255,122,47,.16),transparent 70%),var(--k)}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.05;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .94 0 0 0 0 .925 0 0 0 0 .88 0 0 0 1 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
#app{position:relative;z-index:2;max-width:430px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 18px env(safe-area-inset-bottom,0px);--fit:1}
.prog{display:flex;gap:4px;padding:12px 0 0;flex-shrink:0}.prog i{flex:1;height:3px;background:rgba(240,236,224,.16)}.prog i.d{background:var(--lime)}.prog i.a{background:var(--ow)}
.hd{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0 0}
.step{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.ttl{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
/* headline never shrinks with --fit; only the funnel + result do */
h1{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:clamp(40px,7.3dvh,48px);line-height:.95;letter-spacing:.5px;color:var(--ow);white-space:nowrap}
h1 span{color:var(--lime);text-shadow:0 0 14px rgba(200,241,53,.5)}
.sub{flex-shrink:0;display:flex;align-items:center;gap:8px;margin:5px 0 2px}
.appl{flex-shrink:0;font-size:10px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}.appl b{color:var(--lime)}
.info{flex-shrink:0;font-size:10px;color:var(--ow);border:1px solid rgba(240,236,224,.35);border-radius:999px;min-height:26px;padding:0 9px;white-space:nowrap}
.lbl{flex-shrink:0;padding:2px 7px;white-space:nowrap;border-radius:999px;font-size:10px;letter-spacing:.05em;font-weight:700;color:var(--k);background:linear-gradient(90deg,var(--lime),var(--or))}
.main{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:safe center;padding-top:4px}
.main>*{flex-shrink:0}.main>:first-child{margin-top:auto}.main>:last-child{margin-bottom:auto}
#funnel{filter:drop-shadow(0 0 8px rgba(200,241,53,.28)) drop-shadow(0 0 14px rgba(255,122,47,.2))}
.band{--bh:calc(clamp(34px,7.3dvh,54px)*var(--fit));position:relative;height:var(--bh);margin:0 auto calc(4px*var(--fit));display:flex;align-items:center;gap:6px;color:var(--k);cursor:pointer}
.band .lb2{display:flex;flex-direction:column;min-width:0;line-height:1.15}.band .lb2 b{font-size:12px;font-weight:700;white-space:nowrap}.band .lb2 small{font-size:10px;letter-spacing:-.02em;white-space:nowrap;opacity:.8}
.band .lb2.st b{display:flex;align-items:center;gap:6px;font-size:12px;letter-spacing:.06em;line-height:1}.band .lb2.st small{font-size:10px;margin-top:1px}
.band .lb2.st .cty{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:clamp(19px,calc(26px*var(--fit)),26px);line-height:.9;letter-spacing:.02em;color:var(--k);-webkit-text-stroke:.6px var(--k);white-space:nowrap}
.band .rk{font-family:'Bebas Neue',sans-serif;font-size:17px;line-height:1;opacity:.55;width:17px;flex-shrink:0}
.band .lb{font-size:11px;font-weight:700;line-height:1.1;min-width:0;flex:1;white-space:normal;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.band .lb .nw{white-space:nowrap}
.tight .band .kw{display:none}.band .pc{display:flex;align-items:center;gap:3px}.band .pc .bd{font-size:8px;line-height:1;padding:1px 3px .5px;border-width:1px;border-radius:3px;letter-spacing:.02em}
.band .sp{flex:0 0 2px}.band.start .sp{flex:1}
.band .ct{font-family:'Bebas Neue',sans-serif;font-size:clamp(15px,calc(23px*var(--fit)),23px);line-height:.95;white-space:nowrap}
.band .ctw{display:flex;flex-direction:column;align-items:flex-end;flex-shrink:0;line-height:1}
.band .pc{font-size:10px;font-weight:700;line-height:1.05;white-space:nowrap;opacity:.78;letter-spacing:-.01em}
.band .ed{flex-shrink:0;height:min(28px,calc(var(--bh) - 6px));padding:0 8px;border-radius:999px;background:var(--k);color:var(--lime);font-size:10px;font-weight:700;letter-spacing:.08em}
.bd{flex-shrink:0;display:inline-block;font-size:10px;line-height:1;font-weight:700;letter-spacing:.03em;padding:3px 5px 2px;border-radius:4px;white-space:nowrap;border:1.5px solid var(--k)}
.b-acs{background:var(--k);color:var(--lime)}
.b-nhanes{background:transparent;color:var(--k)}
.b-pew{background:var(--w);color:var(--k);border-color:var(--w)}
.b-nsfg{background:var(--k);color:var(--or)}
.b-ipeds{background:var(--or);color:var(--k);border-color:var(--k)}
.b-gss{background:transparent;color:var(--k);border-style:dashed}
.unused{display:flex;align-items:center;gap:8px;width:100%;margin:calc(4px*var(--fit)) 0 0;padding:4px 4px 4px 10px;border:1px dashed rgba(240,236,224,.35);border-radius:12px;text-align:left}
.unused .ut{flex:1;min-width:0;font-size:10px;line-height:1.35;color:var(--muted)}.unused .ut b{color:var(--ow);font-weight:400}.unused .ut span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unused .ed{flex-shrink:0;height:26px;padding:0 10px;border-radius:999px;background:var(--lime);color:var(--k);font-size:10px;font-weight:700;letter-spacing:.08em;display:inline-flex;align-items:center}
@media (max-width:385px){.band{gap:4px}.band .ed{padding:0 6px}.band .rk{width:14px}}
/* optional-prefs sheet */
.op-blk{padding:7px 0;border-top:1px solid rgba(240,236,224,.1)}.op-blk:first-of-type{border-top:0}
.op-hd{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ow);margin-bottom:5px}.op-hd .rk{font-family:'Bebas Neue',sans-serif;font-size:16px;color:var(--muted)}.op-hd .res{margin-left:auto;font-size:10px;color:var(--muted);white-space:nowrap}.op-hd .res b{color:var(--lime);font-weight:700}
.op-chips{display:flex;flex-wrap:wrap;gap:5px}.op-chip{min-height:30px;padding:0 10px;border-radius:999px;border:1px solid rgba(240,236,224,.25);font-size:11px;color:var(--ow)}.op-chip.on{background:var(--lime);border-color:var(--lime);color:var(--k);font-weight:700}
.memleg{flex-shrink:0;font-size:10px;color:var(--muted);margin:0 0 3px;white-space:nowrap}.memleg b{color:var(--w)}.memleg i{font-style:normal;color:var(--k);background:var(--or);border-radius:3px;padding:1px 4px;font-weight:700;margin-right:4px}
.band .pc b{font-weight:700;text-decoration:underline;text-underline-offset:2px}
.pe-sub{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:8px 0 2px}
.pe-chips{display:flex;flex-wrap:wrap;gap:6px}.pe-chip{min-height:34px;padding:0 12px;border-radius:999px;border:1px solid rgba(240,236,224,.25);font-size:12px}.pe-chip.on{background:var(--lime);color:var(--k);border-color:var(--lime);font-weight:700}
.pe-agerow{display:flex;align-items:center;gap:10px;margin:2px 0 4px;font-size:11px;color:var(--muted)}.pe-agerow label{display:flex;align-items:center;gap:6px}
.pe-sel{font:inherit;font-size:16px;color:var(--ow);background:#22221e;border:1px solid var(--lime);border-radius:8px;padding:6px 8px}
.pe-now{font-size:11px;color:var(--muted);margin:0 0 6px}.pe-now b{color:var(--lime)}.pe-mem{color:var(--w)}
.pe-opt.dis{opacity:.4;cursor:default}.pe-opt.dis b{color:var(--muted);font-weight:400;font-size:11px}
.pe-badge.src-gss{background:transparent;color:var(--ow);border-color:var(--ow);border-style:dashed}
.neck{height:calc(18px*var(--fit));margin:2px auto 0;background:linear-gradient(180deg,var(--or),rgba(255,122,47,.25));clip-path:polygon(0 0,100% 0,64% 100%,36% 100%)}
.spout{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:3px}
.spout .big{font-family:'Bebas Neue',sans-serif;font-size:calc(clamp(40px,7.4dvh,56px)*var(--fit));line-height:.9;white-space:nowrap;color:var(--lime);text-shadow:0 0 14px rgba(200,241,53,.85),0 0 34px rgba(200,241,53,.45),0 0 60px rgba(255,122,47,.45)}
.spout p{font-size:10px;line-height:1.35;color:var(--ow);text-align:left;white-space:nowrap}.spout p b{color:var(--lime)}
.bottom{flex-shrink:0;padding:8px 0 4px;display:flex;flex-direction:column}
.next{width:100%;height:50px;font-family:'Bebas Neue',sans-serif;font-size:23px;letter-spacing:.12em;color:var(--k);background:var(--lime);border-radius:6px;box-shadow:0 0 18px rgba(200,241,53,.35)}
.back{height:34px;display:flex;align-items:center;justify-content:center;font-size:11px;letter-spacing:.08em;color:var(--muted)}
.mock{position:fixed;right:5px;bottom:1px;font-size:8px;letter-spacing:.1em;color:rgba(240,236,224,.22);text-transform:uppercase;pointer-events:none;z-index:3}
/* sheets */
.pe-sheet,.src-sheet{position:fixed;inset:0;z-index:50}
.pe-back,.src-back{position:absolute;inset:0;background:rgba(14,14,14,.72)}
.pe-panel{max-height:96dvh;overflow:auto}
.pe-panel,.src-panel{position:absolute;left:0;right:0;bottom:0;max-width:430px;margin:0 auto;background:#171714;border-top:2px solid var(--lime);border-radius:16px 16px 0 0;padding:12px 18px 14px;box-shadow:0 -10px 34px rgba(255,122,47,.25);transform:translateY(100%);transition:transform .22s}
.pe-sheet.show .pe-panel,.src-sheet.show .src-panel{transform:none}
.pe-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.pe-k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pe-badge{font-size:10px;font-weight:700;padding:2px 5px;border-radius:4px;margin-left:4px;border:1.5px solid var(--lime)}
.pe-badge.src-acs{background:var(--k);color:var(--lime)}.pe-badge.src-nhanes{color:var(--ow);border-color:var(--ow)}.pe-badge.src-pew{background:var(--w);color:var(--k);border-color:var(--w)}.pe-badge.src-nsfg{background:var(--k);color:var(--or);border-color:var(--or)}.pe-badge.src-pew{white-space:nowrap}.pe-badge.src-ipeds{background:var(--or);color:var(--k);border-color:var(--or)}
.pe-opt span{display:flex;flex-direction:column;gap:1px}.pe-sm{font-size:10px;color:var(--muted)}
.pe-x{min-height:40px;color:var(--lime);font-size:11px;letter-spacing:.12em}
.pe-opts{display:flex;flex-direction:column;gap:6px}
.pe-opt{min-height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 14px;border-radius:8px;border:1px solid rgba(240,236,224,.18);text-align:left;font-size:13px}
.pe-opt b{color:var(--lime)}.pe-opt.on{border-color:var(--lime);background:linear-gradient(90deg,rgba(200,241,53,.2),rgba(255,122,47,.16))}
.pe-note{font-size:10px;color:var(--muted);margin:8px 0}
.pe-done{width:100%;min-height:44px;border-radius:8px;background:var(--lime);color:var(--k);font-weight:700;letter-spacing:.1em;font-size:12px;text-transform:uppercase}
.src-panel{max-height:94dvh;overflow:auto;font-size:10px;line-height:1.45;color:rgba(240,236,224,.8)}.src-panel b{color:var(--ow)}
.src-leg{display:flex;flex-wrap:wrap;gap:6px 8px;margin:8px 0;padding:8px;border-radius:8px;background:var(--lime);color:var(--k);font-size:10px;align-items:center}
.src-leg span{display:inline-flex;gap:4px;align-items:center}
</style></head>
<body><!-- SANDBOX MOCKUP V3 (neon funnel, brand palette, no-scroll; condensed from V2A). Amanda's real preferences x public data; counts estimated. City names shown (no ZIP/address). -->
<div id="app">
  <div class="prog"><i class="d"></i><i class="d"></i><i class="d"></i><i class="d"></i><i class="a"></i></div>
  <div class="hd"><span class="step">Step 5 of 5</span><span class="appl">Applying as: <b>Single</b> · <u>Edit</u></span></div>
  <div class="ttl"><h1 id="h1">Your <span>Pool</span></h1><button class="info" type="button" id="infoBtn">ⓘ Sources</button></div>
  <div class="sub"><span class="lbl">YOUR REAL PREFERENCES · COUNTS ESTIMATED</span></div>
  <div class="memleg" id="memleg" hidden></div>
  <div class="main">
    <div id="funnel"></div>
    <button class="unused" type="button" id="unused" aria-label="Turn on an unused preference"></button>
    <div class="neck" id="neck"></div>
    <div class="spout"><div class="big" id="big"></div><p id="spoutp"></p></div>
  </div>
  <div class="bottom"><button class="next" type="button">NEXT</button><a class="back" href="all-cards_grokbot.html#sec-pool" target="_top">&larr; BACK</a></div>
</div>
<div class="mock">mockup · V3 brand palette</div>
<script src="your-pool-real-data_grokbot.js"></script>
<script src="your-pool-engine_grokbot.js"></script>
<script>
const E=PoolEngine, S=E.S, $=s=>document.querySelector(s);
// header: AMANDA’S POOL (signup first name), YOUR POOL if there is no name
$('#h1').innerHTML=(E.poss()||'Your')+' <span>Pool</span>'; document.title=document.title.replace(/^Your pool/i,E.poolTitle());
// every pick spelled out (site option order); each pick stays on one line, picks wrap between them
const nw=t=>`<span class="nw">${t}</span>`;
const all=(k,pre)=>{const a=E.multiL(k).split(' · '); return a.map((x,i)=>nw((i===0&&pre?pre+' ':'')+x+(i<a.length-1?' ·':''))).join(' ')};
const SHORT={age:()=>'Age '+S.amin+'–'+S.amax,
  intent:()=>S.intent.length?all('intent','Looking for:'):'Looking for: any',
  kids:()=>!S.kids.length?'Want kids: any':S.kids.length===1&&S.kids[0]==='yes'?'Wants kids':all('kids','Want kids:'),
  height:()=>E.hL(),
  edu:()=>S.edu.length?all('edu'):'Any degree',
  inc:()=>S.inc.length?all('inc'):'Any income',
  eth:()=>all('eth'), relig:()=>all('relig'), pol:()=>all('pol'), tier:()=>all('tier','Tier:'),
  haskids:()=>S.haskids.length===1?({no:'No kids',yes:'Has kids'})[S.haskids[0]]:'Kids: any'};
// two-line labels for narrow optional bands
// band labels: every pick spelled out. Shrink type (11px -> 9px) to fit two lines; if still too long, allow a third line
// when the band is tall enough (down to 8.5px). Clamping (…) is only a last resort and is reported by the fit check.
const lbOver=()=>[...document.querySelectorAll('.band .lb')].some(e=>e.scrollHeight>e.clientHeight+2||[...e.querySelectorAll('.nw')].some(n=>n.offsetWidth>e.clientWidth+1));
function fitLabels(){document.querySelectorAll('.band .lb').forEach(el=>{const band=el.closest('.band'); el.style.fontSize=''; el.style.webkitLineClamp='unset'; el.style.display='block';
  const lh=()=>parseFloat(getComputedStyle(el).lineHeight), nwOk=()=>[...el.querySelectorAll('.nw')].every(n=>n.offsetWidth<=el.clientWidth+1);
  const fits=n=>el.scrollHeight<=n*lh()+1&&nwOk(); let px=11;
  while(!fits(2)&&px>9){px-=.5; el.style.fontSize=px+'px';}
  let lines=2; if(!fits(2)){const max3=Math.floor((band.clientHeight-2)/lh())>=3; if(max3){lines=3; px=10; el.style.fontSize=px+'px'; while(!fits(3)&&px>8.5){px-=.5; el.style.fontSize=px+'px';}} else while(!fits(2)&&px>8){px-=.5; el.style.fontSize=px+'px';}}
  el.style.display=''; el.style.webkitLineClamp=lines;});}
const B={acs:'b-acs',nhanes:'b-nhanes',pew:'b-pew',nsfg:'b-nsfg',ipeds:'b-ipeds',gss:'b-gss'};
const pct=k=>k>=0.995?'100%':k<0.01?'<1%':Math.round(k*100)+'%';
const cum=x=>x>=10?Math.round(x)+'%':x>=1?x.toFixed(1)+'%':x>=0.1?x.toFixed(1)+'%':x.toFixed(2)+'%';
// lime -> orange mix (only brand hexes)
const L=[200,241,53], O=[255,122,47];
const mix=t=>`rgb(${L.map((v,i)=>Math.round(v+(O[i]-v)*t)).join(',')})`;
function trap(top,bot){const a=(100-top)/2,b=(100-bot)/2;return `polygon(${a}% 0,${100-a}% 0,${100-b}% 100%,${b}% 100%)`}
function render(){
  const C=E.compute(), {start,steps,final}=C; const cuts=steps.filter(s=>s.r.k&&!s.r.fixed); const cityName=E.cityName(); const mem=!!C.members;
  const ml=$('#memleg'); ml.hidden=!mem; if(mem) ml.innerHTML=`${C.members.preview?'<i>PREVIEW</i>':''}% kept: <b>IHBC members</b> · studies`;
  const W=n=>72+28*Math.max(0,Math.min(1,Math.log(n/40)/Math.log(start/40)));
  let h='', prev=100; const n=cuts.length;
  h+=`<div class="band start" data-k="city" role="button" aria-label="Seeking ${E.seekL().toLowerCase()} in ${E.cityName()}: change city or distance" style="width:100%;clip-path:${trap(100,97)};background:linear-gradient(90deg,var(--ow),var(--lime));padding:0 12px"><span class="lb2 st"><b><span class="sk">${E.seekL()}</span><span class="cty">${E.cityName()}</span></b><small>${E.seekN()} 21–80 · ≤${S.radius} mi</small></span><span class="sp"></span><span class="ctw"><span class="ct">${E.fmt(start)}</span><span class="pc"><span class="bd b-acs">${E.SRC.acs}</span>start</span></span><button class="ed" type="button" data-k="city">EDIT</button></div>`;
  prev=97;
  const step=(97-72)/Math.max(n,1);
  cuts.forEach((s,i)=>{const r=s.r, w=Math.max(72,Math.min(prev-Math.min(3,step),W(s.n))), t=(i+1)/n;
    const inset=(100-w)/2;
    h+=`<div class="band" data-k="${r.k}" role="button" aria-label="Edit ${r.name}" style="width:100%;clip-path:${trap(prev,w)};background:linear-gradient(90deg,${mix(Math.max(0,t-.2))},${mix(t)});padding:0 calc(${inset}% + 9px)"><span class="lb">${SHORT[r.k]()}</span><span class="sp"></span><span class="ctw"><span class="ct">${E.fmt(s.n)}</span><span class="pc"><span class="bd ${B[r.src]}">${E.SRC[r.src]}</span>${mem&&s.member!=null?`<b>${pct(s.member)}</b> · ${pct(s.keep)}`:'<span class="kw">keeps </span>'+pct(s.keep)}</span></span><button class="ed" type="button" data-k="${r.k}">EDIT</button></div>`;
    prev=w;
  });
  $('#funnel').innerHTML=h; $('#neck').style.width=(prev*0.8)+'%';
  // unused (Any) prefs: one row, one EDIT
  const un=E.ROWS.filter(r=>r.fixed==='nocut'), u=$('#unused');
  if(!un.length){u.style.display='none';} else {
    u.style.display='';
    const names=un.map(r=>`${r.uname||r.name}`); const lines=[[],[]]; let len=0, tot=names.join(' · ').length;
    let best=1e9; for(let i=1;i<=names.length;i++){const l1=names.slice(0,i).join(' · ').length+2, l2=i<names.length?names.slice(i).join(' · ').length+13:0, m=Math.max(l1,l2); if(m<best){best=m; lines[0]=names.slice(0,i); lines[1]=names.slice(i);}}
    u.innerHTML=`<span class="ut"><span><b>${lines[0].join(' · ')}${lines[1].length?' ·':''}</b></span>${lines[1].length?`<span><b>${lines[1].join(' · ')}</b>: any, no cut</span>`:`<span>any, no cut · tap to turn on</span>`}</span><span class="ed">EDIT</span>`;
  }
  u.onclick=openOptional;
  $('#big').textContent='≈'+E.fmt(final);
  $('#spoutp').innerHTML=`match everything you picked<br><b>${cum(final/start*100)}</b> of ${E.fmt(start)} ${E.seekN()}`+(mem?`<br>${C.members.preview?'PREVIEW · ':''}${E.fmt(C.members.count)} IHBC members`:'');
  document.querySelectorAll('.band[data-k]').forEach(b=>b.onclick=()=>E.openEdit(b.dataset.k,render));
  fit();
}
// sheet: turn unused (Any) prefs on, or back off
function openOptional(){
  E.close(); const wrap=document.createElement('div'); wrap.className='pe-sheet'; wrap.id='pe-sheet';
  const opts=E.ROWS.filter(r=>r.optional);
  const draw=()=>{const c=E.compute(), by={}; c.steps.forEach(s=>by[s.r.rk]=s); const op=wrap.querySelector('.pe-panel'), st0=op?op.scrollTop:0;
    wrap.innerHTML=`<div class="pe-back"></div><div class="pe-panel" role="dialog" aria-label="Unused preferences">
    <div class="pe-top"><span class="pe-k">Unused preferences</span><button type="button" class="pe-x">DONE</button></div>
    ${opts.map(r=>{const s=by[r.rk], on=!E.isAny(r.k), multi=!!E.D[r.k].multi;  /* single-select keys (tier) keep an array of one pick */
      return `<div class="op-blk"><div class="op-hd">${r.name}<span class="pe-badge src-${r.src}">${E.SRC[r.src]}</span><span class="res">${on?`<b>≈ ${E.fmt(s.n)}</b> · keeps ${pct(s.keep)}`:'any · no cut'}</span></div>${on&&s.member!=null?`<div class="pe-sm" style="margin:-2px 0 4px">${E.memLine(s)}</div>`:''}
      <div class="op-chips">${E.D[r.k].opts.map(([id,l])=>{const sel=multi?(id==='any'?!S[r.k].length:S[r.k].includes(id)):S[r.k]===id; return `<button type="button" class="op-chip${sel?' on':''}" data-k="${r.k}" data-id="${id}">${l}</button>`}).join('')}</div></div>`}).join('')}
    <p class="pe-note">These are “Any” in your picks, so they don’t cut. Turn one on to add it after your ranked picks (Education tier takes one, a minimum; the others take several, each group counted once). Your pool now: <b style="color:var(--lime)">≈ ${E.fmt(c.final)}</b>. Sources in ⓘ.</p>
    <button type="button" class="pe-done">Done — update pool</button></div>`;
    {const np=wrap.querySelector('.pe-panel'); if(np&&st0) np.scrollTop=st0;}
    wrap.querySelectorAll('.op-chip').forEach(b=>b.onclick=()=>{const k=b.dataset.k,id=b.dataset.id; if(E.D[k].single){S[k]=id==='any'?[]:[id];} else if(E.D[k].multi){S[k]=id==='any'?[]:(S[k].includes(id)?S[k].filter(x=>x!==id):S[k].concat(id)); const it=E.D[k].opts.map(o=>o[0]).filter(x=>x!=='any'&&x!=='none'); if(it.every(x=>S[k].includes(x))) S[k]=[];} else S[k]=id; draw(); render();});
    wrap.querySelector('.pe-x').onclick=wrap.querySelector('.pe-done').onclick=wrap.querySelector('.pe-back').onclick=()=>E.close();
  };
  draw(); document.body.appendChild(wrap); requestAnimationFrame(()=>wrap.classList.add('show'));
}
// shrink bands + result if the screen is shorter than expected, so nothing spills (headline never shrinks)
function pickSub(){ const b=document.querySelector('.band.start .lb2.st b'), cy=b&&b.querySelector('.cty'); if(!cy) return;
  const ids=E.cityIds(), full=E.cityName(), sh=ids.length===E.D.city.ORDER.length?'All cities':ids.length>1?ids.length+' cities':full; cy.style.fontSize=''; cy.textContent=full;
  const over=()=>b.scrollWidth>b.clientWidth+1;
  const px0=parseFloat(getComputedStyle(cy).fontSize); let px=px0; while(over()&&px>19){px-=1; cy.style.fontSize=px+'px';}
  if(over()){cy.textContent=sh; px=px0; cy.style.fontSize=''; while(over()&&px>16){px-=1; cy.style.fontSize=px+'px';}} }
function fitH1(){const t=$('.ttl'),h=$('#h1'),i=$('#infoBtn'); E.fitFont(h,t.clientWidth-i.offsetWidth-8,30);}
function fit(){fitH1();const a=$('#app'),m=$('.main');let f=1;a.style.setProperty('--fit',1);
  const fu=$('#funnel'); fu.classList.remove('tight'); fitLabels(); while(f>0.5&&(m.scrollHeight>m.clientHeight+1)){f-=0.03;a.style.setProperty('--fit',f.toFixed(2)); fitLabels();}
  if(lbOver()){fu.classList.add('tight'); fitLabels();} pickSub();}
addEventListener('resize',fit);document.fonts&&document.fonts.ready.then(fit);
$('#infoBtn').onclick=()=>{const w=document.createElement('div'); w.className='src-sheet';
  w.innerHTML=`<div class="src-back"></div><div class="src-panel"><div class="pe-top"><span class="pe-k">Sources &amp; method</span><button class="pe-x" type="button">CLOSE</button></div>
  <div class="src-leg"><span><span class="bd b-acs">CENSUS</span>direct ACS count</span><span><span class="bd b-nhanes">CDC</span>direct NHANES</span><span><span class="bd b-pew">EST</span>blend of studies (intentions, kids, religion, politics, tier, $1M+ income from IRS SOI 2023)</span></div>
  <p>${E.SOURCES}</p><p style="margin-top:6px">Each step keeps: ${E.compute().steps.filter(s=>s.r.k&&!s.r.fixed).map(s=>s.r.name+' '+E.pct(s.keep)+(s.member!=null?' (IHBC '+E.pct(s.member)+')':'')).join(' · ')}.</p></div>`;
  const c=()=>w.remove(); document.body.appendChild(w); requestAnimationFrame(()=>w.classList.add('show'));
  w.querySelector('.src-back').onclick=w.querySelector('.pe-x').onclick=c;};
render();
</script>
