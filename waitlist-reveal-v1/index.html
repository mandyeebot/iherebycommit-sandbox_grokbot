<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>I Hereby Commit · Waitlist Reveal mockups (v1, example data)</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--bg:#0e0e0e;--text:#f0ece0;--body:#9a978c;--muted:#888;--dim:#333;--lime:#c8f135;--orange:#FF7A2F;--radius:4px;--accent:var(--lime)}
body.couples{--accent:var(--orange)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:'Space Mono',monospace}
body{min-height:100vh;display:flex;justify-content:center}
.phone{width:393px;min-height:852px;position:relative;padding:10px 16px 18px;overflow:hidden}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.logo{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;color:var(--text)}
.logo b{color:var(--accent);font-weight:400}
.flowtoggle{display:flex;gap:4px}
.flowtoggle button{font-family:'Space Mono',monospace;font-size:10px;padding:5px 8px;border:1px solid var(--dim);background:transparent;color:var(--muted);border-radius:var(--radius);cursor:pointer;text-transform:uppercase}
.flowtoggle button.on{border-color:var(--accent);color:var(--bg);background:var(--accent)}
.progress{display:flex;gap:3px;margin:6px 0 8px}
.progress span{flex:1;height:3px;background:var(--dim);border-radius:2px}
.progress span.done{background:var(--accent)}
/* 9:16 story card */
.card{width:361px;height:642px;position:relative;border-radius:10px;overflow:hidden;background:var(--bg);border:1px solid #222;cursor:pointer;user-select:none}
.card .inner{position:absolute;inset:0;padding:26px 22px 20px;display:flex;flex-direction:column}
.card.hero .inner{background:var(--accent);color:#0e0e0e}
.kicker{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.hero .kicker{color:#0e0e0e;opacity:.75}
.big{font-family:'Bebas Neue',sans-serif;font-size:112px;line-height:.85;color:var(--accent);letter-spacing:1px}
.hero .big{color:#0e0e0e}
.big small{font-size:40px}
h2.head{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:38px;line-height:.95;letter-spacing:.5px;margin:10px 0 12px;color:var(--text)}
.hero h2.head{color:#0e0e0e}
.sub{font-size:12px;line-height:1.55;color:var(--body)}
.sub b{color:var(--text);font-weight:700}
.hero .sub{color:#1c1c1c}.hero .sub b{color:#0e0e0e}
.viz{margin:16px 0 8px;flex:1;display:flex;align-items:center;justify-content:center}
.foot{margin-top:auto;border-top:1px solid #262626;padding-top:8px;display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.hero .foot{border-top-color:rgba(0,0,0,.25)}
.src{font-size:8.5px;line-height:1.35;color:var(--muted);max-width:245px}
.hero .src{color:#222}
.brand{font-family:'Bebas Neue',sans-serif;font-size:15px;color:var(--text);white-space:nowrap}
.hero .brand{color:#0e0e0e}
.example{position:absolute;top:8px;right:10px;font-size:8px;letter-spacing:1px;text-transform:uppercase;color:#777;border:1px solid #333;padding:1px 5px;border-radius:3px;background:rgba(14,14,14,.6)}
.hero .example{color:#0e0e0e;border-color:rgba(0,0,0,.35);background:transparent}
.private{position:absolute;top:8px;left:10px;font-size:8px;letter-spacing:1px;text-transform:uppercase;color:var(--bg);background:var(--muted);padding:1px 5px;border-radius:3px}
/* dots viz */
.dots{display:grid;grid-template-columns:repeat(14,1fr);gap:5px;width:100%}
.dots i{display:block;width:100%;aspect-ratio:1;border-radius:50%;background:var(--dim)}
.dots i.m{background:var(--accent)}
.dots i.w{background:var(--text)}
.dots i.x{background:transparent;border:1px solid #444}
.legend{font-size:9px;color:var(--muted);margin-top:8px;display:flex;gap:12px}
.legend em{font-style:normal;display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}
.bar{width:100%}
.bar .row{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:10px;color:var(--body)}
.bar .row .lbl{width:92px;text-align:right}
.bar .track{flex:1;height:14px;background:#1b1b1b;border-radius:2px;position:relative}
.bar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:2px}
.bar .fill.alt{background:#555}
.bar .val{width:40px;font-weight:700;color:var(--text)}
.timeline{width:100%;position:relative;height:150px}
.timeline .line{position:absolute;left:0;right:0;top:70px;height:2px;background:#333}
.timeline .pt{position:absolute;top:62px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--accent);border:3px solid var(--bg)}
.timeline .pt.ghost{background:#555}
.timeline .lab{position:absolute;width:90px;margin-left:-45px;text-align:center;font-size:9px;color:var(--body);line-height:1.3}
.timeline .lab b{display:block;font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--text);font-weight:400}
.sil{display:flex;align-items:flex-end;justify-content:center;gap:26px;height:230px;width:100%}
.sil div{display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--body)}
.sil svg{display:block}
.map{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips span{font-size:10px;border:1px solid var(--accent);color:var(--accent);padding:4px 8px;border-radius:14px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%}
.quick button{font-family:'Space Mono',monospace;font-size:11px;padding:10px 6px;border:1px solid #444;background:#151515;color:var(--text);border-radius:var(--radius)}
.cta{display:block;width:100%;font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1px;padding:12px;border:0;border-radius:var(--radius);background:var(--accent);color:#0e0e0e;margin-top:8px;cursor:pointer}
.cta.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.hero .cta{background:#0e0e0e;color:var(--accent)}
.lock{font-size:40px;text-align:center}
/* share row */
.share{display:flex;gap:6px;margin-top:10px}
.share button{flex:1;font-family:'Space Mono',monospace;font-size:10px;padding:9px 4px;border:1px solid var(--dim);background:#151515;color:var(--text);border-radius:var(--radius);cursor:pointer}
.share button.primary{background:var(--accent);color:#0e0e0e;border-color:var(--accent);font-weight:700}
.share button:disabled{opacity:.35;cursor:not-allowed}
.navhint{display:flex;justify-content:space-between;font-size:9px;color:#555;margin-top:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--accent);color:#0e0e0e;font-size:11px;padding:8px 12px;border-radius:var(--radius);opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.mocknote{font-size:8.5px;color:#555;margin-top:6px;line-height:1.4}
</style></head>
<body>
<div class="phone">
  <div class="topbar">
    <div class="logo">I HEREBY <b>COMMIT</b></div>
    <div class="flowtoggle"><button id="bS" onclick="setFlow('singles')">Single</button><button id="bC" onclick="setFlow('couples')">Couple</button></div>
  </div>
  <div class="progress" id="progress"></div>
  <div id="cardwrap"></div>
  <div class="share" id="share">
    <button class="primary" onclick="exportPng()">⤓ Save 9:16</button>
    <button onclick="shareIG()">IG Story</button>
    <button onclick="shareX()">Post on X</button>
    <button onclick="copyLink()">Copy link</button>
  </div>
  <div class="navhint"><span>◀ tap left</span><span id="count"></span><span>tap right ▶</span></div>
  <div class="mocknote">Mockup v1 (Sep 27, 2026). All personal values are EXAMPLE DATA for a made-up person. Public benchmarks are real values from the loaded ACS, CDC, GSS, Atlas and published League sources. Not the production site.</div>
</div>
<div class="toast" id="toast"></div>

<script>
const EX = '<span class="example">example data</span>';
function dots(men, women){ // men per 100 women scaled into a 14-col grid
  let h='';const m=Math.round(men/5), w=Math.round(women/5);
  for(let i=0;i<m;i++) h+='<i class="m"></i>';
  for(let i=0;i<w;i++) h+='<i class="w"></i>';
  return '<div style="width:100%"><div class="dots">'+h+'</div><div class="legend"><span><em style="background:var(--accent)"></em>single men</span><span><em style="background:var(--text)"></em>single women</span><span>1 dot = 5 people</span></div></div>';
}
function dotsFilter(total, kept){
  let h='';const t=Math.round(total/5),k=Math.round(kept/5);
  for(let i=0;i<t;i++) h+= i<k?'<i class="m"></i>':'<i class="x"></i>';
  return '<div style="width:100%"><div class="dots">'+h+'</div><div class="legend"><span><em style="background:var(--accent)"></em>still in your range</span><span><em style="border:1px solid #444"></em>filtered out</span></div></div>';
}
function bars(rows){return '<div class="bar">'+rows.map(r=>`<div class="row"><span class="lbl">${r[0]}</span><span class="track"><span class="fill ${r[3]||''}" style="width:${r[2]}%"></span></span><span class="val">${r[1]}</span></div>`).join('')+'</div>';}
function person(h, label, fill){const px=Math.round(h*1.15);return `<div><svg width="${Math.round(px*0.32)}" height="${px}" viewBox="0 0 32 100" preserveAspectRatio="none"><circle cx="16" cy="9" r="8" fill="${fill}"/><rect x="6" y="19" width="20" height="44" rx="6" fill="${fill}"/><rect x="7" y="60" width="8" height="40" rx="3" fill="${fill}"/><rect x="17" y="60" width="8" height="40" rx="3" fill="${fill}"/></svg><span style="margin-top:6px">${label}</span></div>`;}
function foot(src){return `<div class="foot"><div class="src">${src}</div><div class="brand">IHEREBYCOMMIT.COM</div></div>`;}

let flow='singles', idx=0;
function qs(k){return new URLSearchParams(location.search).get(k);}
function setFlow(f){flow=f;idx=0;document.body.className=f;document.getElementById('bS').classList.toggle('on',f==='singles');document.getElementById('bC').classList.toggle('on',f==='couples');render();}
function go(i){idx=Math.max(0,Math.min(FLOWS[flow].length-1,i));render();}
function render(){
  const cards=FLOWS[flow], c=cards[idx];
  document.getElementById('progress').innerHTML=cards.map((_,i)=>`<span class="${i<=idx?'done':''}"></span>`).join('');
  document.getElementById('cardwrap').innerHTML=`<div class="card ${c.hero?'hero':''}" id="card">${c.html}</div>`;
  document.getElementById('count').textContent=(idx+1)+' / '+cards.length;
  document.querySelectorAll('#share button').forEach(b=>b.disabled=!!c.noshare);
  document.getElementById('card').addEventListener('click',e=>{ if(e.target.closest('button'))return; const r=e.currentTarget.getBoundingClientRect(); (e.clientX-r.left)<r.width*0.33?go(idx-1):go(idx+1);});
}
function shareUrl(){return location.origin+location.pathname+'?flow='+flow+'&card='+(idx+1)+'&v=1';}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1600);}
async function renderPng(){
  const card=document.getElementById('card');
  const canvas=await html2canvas(card,{scale:1080/card.offsetWidth,backgroundColor:null,useCORS:true});
  // 361x642 at scale 2.9917 -> 1080x1920 (9:16)
  const out=document.createElement('canvas');out.width=1080;out.height=1920;
  const ctx=out.getContext('2d');ctx.fillStyle='#0e0e0e';ctx.fillRect(0,0,1080,1920);ctx.drawImage(canvas,0,0,1080,1920);
  return out;
}
async function exportPng(){
  const out=await renderPng();
  const a=document.createElement('a');a.download='ihbc-'+FLOWS[flow][idx].id+'-story-1080x1920.png';a.href=out.toDataURL('image/png');a.click();
  window.__lastPng=a.href; toast('Saved 1080×1920 story image');
}
async function shareIG(){
  const out=await renderPng();
  out.toBlob(async blob=>{
    const file=new File([blob],'ihbc-story.png',{type:'image/png'});
    if(navigator.canShare && navigator.canShare({files:[file]})){ try{await navigator.share({files:[file],title:'I Hereby Commit'});}catch(e){} }
    else { const a=document.createElement('a');a.download='ihbc-story.png';a.href=URL.createObjectURL(blob);a.click(); toast('Saved. Open Instagram → Story → pick the image'); }
  });
}
function shareX(){const c=FLOWS[flow][idx];window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(c.share)+'&url='+encodeURIComponent(shareUrl()),'_blank');}
function copyLink(){navigator.clipboard&&navigator.clipboard.writeText(shareUrl());toast('Link copied');}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(idx+1);if(e.key==='ArrowLeft')go(idx-1);});
setFlow(qs('flow')==='couples'?'couples':'singles');
if(qs('card')) go(parseInt(qs('card'),10)-1);
</script>
</body></html>
